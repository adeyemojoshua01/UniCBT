    <!-- MAIN APPLICATION JAVASCRIPT (EMBEDDED)                       -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // IMAGE VIEWER MODULE
        // ============================================================


function compressImage(file, maxWidth, maxHeight, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width = Math.round((width * maxHeight) / height);
                                height = maxHeight;
                            }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob(blob => {
                            resolve(new File([blob], file.name, { type: 'image/jpeg' }));
                        }, 'image/jpeg', quality);
                    };
                    img.onerror = reject;
                };
                reader.onerror = reject;
            });
        }

        const imageViewer = {
            images: [],
            scale: 1,

            init: function() {
                this.setupEventListeners();
            },

            setupEventListeners: function() {
                // No admin upload areas – image viewing only
            },

            open: function(images, title) {
                this.images = images || [];
                const modal = document.getElementById('image-modal');
                document.getElementById('image-modal-title').textContent = title || 'Reference Images';
                document.getElementById('image-count').textContent = `${this.images.length} images`;

                if (this.images.length === 0) {
                    document.getElementById('image-viewer-container').classList.add('hidden');
                    document.getElementById('no-images-message').classList.remove('hidden');
                } else {
                    document.getElementById('image-viewer-container').classList.remove('hidden');
                    document.getElementById('no-images-message').classList.add('hidden');
                    this.renderGallery();
                }

                modal.classList.remove('hidden');
            },

            close: function() {
                document.getElementById('image-modal').classList.add('hidden');
                this.images = [];
            },

            renderGallery: function() {
                const gallery = document.getElementById('image-gallery');
                gallery.innerHTML = '';

                this.images.forEach((image) => {
                    const item = document.createElement('div');
                    item.className = 'image-item';
                    item.onclick = () => this.viewFullSize(image.data);

                    const img = document.createElement('img');
                    img.src = image.data;
                    img.alt = image.filename;

                    const filename = document.createElement('div');
                    filename.className = 'filename';
                    filename.textContent = image.filename;

                    item.appendChild(img);
                    item.appendChild(filename);
                    gallery.appendChild(item);
                });
            },

            viewFullSize: function(imageData) {
                const fullscreenModal = document.createElement('div');
                fullscreenModal.className = 'fixed inset-0 bg-black/90 flex items-center justify-center z-[60]';
                fullscreenModal.onclick = () => fullscreenModal.remove();

                const img = document.createElement('img');
                img.src = imageData;
                img.className = 'max-h-[90vh] max-w-[90vw] object-contain';

                fullscreenModal.appendChild(img);
                document.body.appendChild(fullscreenModal);
            },

            zoomIn: function() {
                this.scale += 0.1;
                this.applyZoom();
            },

            zoomOut: function() {
                if (this.scale > 0.3) {
                    this.scale -= 0.1;
                    this.applyZoom();
                }
            },

            applyZoom: function() {
                const images = document.querySelectorAll('.image-item img');
                images.forEach(img => {
                    img.style.transform = `scale(${this.scale})`;
                });
            },

            downloadAll: function() {
                this.images.forEach((image, index) => {
                    const link = document.createElement('a');
                    link.href = image.data;
                    link.download = image.filename || `image-${index + 1}.jpg`;
                    link.click();
                });
                app.showNotification(`Downloading ${this.images.length} images...`, 'success');
            }
        };
        
        



        // ============================================================
        // MAIN APP OBJECT – CANDIDATE ONLY
        // ============================================================

        const app = {
            data: {
                subjects: {},
                currentSubjectId: null,
                questions: [],
                examDuration: 30,
                currentQuestionIndex: 0,
                userAnswers: {},
                candidateName: '',
                timer: null,
                timeLeft: 0,
                mode: 'landing',
                results: [],
                images: {},
                examMode: null, // 'practice' or 'study'
                answerRevealed: {},
                lastResults: null,
                refreshLocked: true
            },

            // ============================================================
            // INITIALIZATION
            // ============================================================

            init: function () {
    this.loadData();
    this.loadResults();
    this.loadImages();
    imageViewer.init();
    this.setupMathJaxPatch();

    // Resume prompt short-circuits the normal landing render
    if (this.checkForSavedExam()) return;

    this.showLanding();
},

                        loadData: function() {
                const storedSubjects = localStorage.getItem('cbt_subjects');
                if (storedSubjects) {
                    this.data.subjects = JSON.parse(storedSubjects);
                    Object.values(this.data.subjects).forEach(subj => {
                        if (!subj.notes) subj.notes = {};
                        if (!subj.topicImages) subj.topicImages = {};
                    });
                } else {
                    this.data.subjects = {}; // Start empty if nothing is saved
                }
            },

            

            loadImages: function() {
                const storedImages = localStorage.getItem('cbt_images');
                if (storedImages) {
                    try {
                        this.data.images = JSON.parse(storedImages);
                    } catch(e) {
                        this.data.images = {};
                    }
                }
            },

            loadResults: function() {
                const storedResults = localStorage.getItem('cbt_results');
                if (storedResults) {
                    try {
                        this.data.results = JSON.parse(storedResults);
                    } catch(e) {}
                }
            },

            saveSubjects: function() {
                localStorage.setItem('cbt_subjects', JSON.stringify(this.data.subjects));
            },

            saveResults: function() {
                localStorage.setItem('cbt_results', JSON.stringify(this.data.results));
                
            },

            saveImages: function() {
                localStorage.setItem('cbt_images', JSON.stringify(this.data.images));
            },

            createSubjectInternal: function(name, duration, questions = [], id = null) {
                const newId = id || 'subj_' + Date.now();
                this.data.subjects[newId] = {
                    id: newId,
                    name: name,
                    duration: parseInt(duration) || 30,
                    questions: questions,
                    topics: [{ id: 'general', name: 'General' }],
                    notes: {},
                    topicImages: {}
                };
                this.saveSubjects();
                return newId;
            },

// ============================================================
// EXAM STATE PERSISTENCE
// ============================================================

saveExamState: function () {
    if (this.data.mode !== 'test') return;
    try {
        localStorage.setItem('cbt_exam_state', JSON.stringify({
            questions:        this.data.questions,
            userAnswers:      this.data.userAnswers,
            answerRevealed:   this.data.answerRevealed,
            currentIndex:     this.data.currentQuestionIndex,
            endTime:          this.data.endTime || null,
            examMode:         this.data.examMode,
            candidateName:    this.data.candidateName,
            currentSubjectId: this.data.currentSubjectId,
            examDuration:     this.data.examDuration,
            timeLeft:         this.data.timeLeft
        }));
    } catch (e) {
        console.warn('saveExamState failed:', e);
    }
},

clearExamState: function () {
    localStorage.removeItem('cbt_exam_state');
},

// Call from init() — returns true if an exam was found and needs a prompt
checkForSavedExam: function () {
    const raw = localStorage.getItem('cbt_exam_state');
    if (!raw) return false;

    let state;
    try { state = JSON.parse(raw); } catch { this.clearExamState(); return false; }

    // Discard if practice exam already ran out of time
    if (state.examMode === 'practice' && state.endTime) {
        const remaining = Math.round((state.endTime - Date.now()) / 1000);
        if (remaining <= 0) { this.clearExamState(); return false; }
        state.timeLeft = remaining;
    }

    this._savedExamState = state;
    this.showResumePrompt(state);
    return true;
},

showResumePrompt: function (state) {
    this.data.mode = 'resume-prompt';
    this.updateHeader();

    const subjectName = this.data.subjects[state.currentSubjectId]?.name || 'Unknown';
    const answered = Object.keys(state.userAnswers || {}).filter(k =>
        state.userAnswers[k] !== undefined && state.userAnswers[k] !== ''
    ).length;

    document.getElementById('app-container').innerHTML = `
        <div class="flex items-center justify-center h-full">
            <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
                <div class="text-center mb-6">
                    <i class="fas fa-clock-rotate-left text-5xl text-blue-600 mb-3"></i>
                    <h2 class="text-2xl font-bold text-gray-800">Unfinished Exam Found</h2>
                    <p class="text-gray-500 mt-1">Would you like to resume?</p>
                </div>

                <div class="bg-gray-50 p-4 rounded mb-6 space-y-1 text-sm">
                    <p><span class="text-gray-500">Candidate:</span> <strong>${state.candidateName || '—'}</strong></p>
                    <p><span class="text-gray-500">Subject:</span> <strong>${subjectName}</strong></p>
                    <p><span class="text-gray-500">Mode:</span> <strong>${state.examMode}</strong></p>
                    <p><span class="text-gray-500">Progress:</span> <strong>${answered} / ${state.questions.length} answered</strong></p>
                </div>

                <div class="space-y-3">
                    <button onclick="event.preventDefault(); app.resumeSavedExam()"
                            class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg">
                        <i class="fas fa-play mr-2"></i>Resume Exam
                    </button>
                    <button onclick="event.preventDefault(); app.discardSavedExam()"
                            class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg">
                        <i class="fas fa-trash mr-2"></i>Discard & Start Fresh
                    </button>
                </div>
            </div>
        </div>`;
},

resumeSavedExam: function () {
    const state = this._savedExamState;
    if (!state) { this.showLanding(); return; }

    this.data.questions            = state.questions;
    this.data.userAnswers          = state.userAnswers || {};
    this.data.answerRevealed       = state.answerRevealed || {};
    this.data.currentQuestionIndex = state.currentIndex || 0;
    this.data.examMode             = state.examMode;
    this.data.candidateName        = state.candidateName || '';
    this.data.currentSubjectId     = state.currentSubjectId;
    this.data.examDuration         = state.examDuration || 30;
    this.data.mode                 = 'test';
    this.data.answerRevealed       = state.answerRevealed || {};

    if (state.examMode === 'practice' && state.endTime) {
        this.data.timeLeft = Math.max(0, Math.round((state.endTime - Date.now()) / 1000));
        if (this.data.timeLeft <= 0) {
            this.clearExamState();
            this.submitTest();
            return;
        }
        this.startTimer();   // see Fix 3 — this now re-uses state.endTime
    } else {
        this.data.timeLeft = 0;
    }

    this._savedExamState = null;
    this.showTestInterface();
},

discardSavedExam: function () {
    this.clearExamState();
    this._savedExamState = null;
    this.showLanding();
},

            // ============================================================
            // NOTIFICATIONS
            // ============================================================

            showNotification: function(message, type = 'info') {
                const existing = document.querySelector('.cbt-notification');
                if (existing) existing.remove();

                const colors = {
                    info: 'bg-blue-100 text-blue-800 border-blue-300',
                    success: 'bg-green-100 text-green-800 border-green-300',
                    warning: 'bg-yellow-100 text-yellow-800 border-yellow-300',
                    error: 'bg-red-100 text-red-800 border-red-300'
                };

                const notification = document.createElement('div');
                notification.className = `cbt-notification fixed top-4 right-4 z-50 p-4 rounded-lg border shadow-lg ${colors[type]}`;
                notification.innerHTML = `
                    <div class="flex items-center gap-3">
                        <i class="fas fa-info-circle"></i>
                        <span class="font-medium">${message}</span>
                        <button onclick="this.parentElement.parentElement.remove()" class="ml-4 text-gray-500 hover:text-gray-700">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                `;

                document.body.appendChild(notification);

                setTimeout(() => {
                    if (notification.parentNode) {
                        notification.remove();
                    }
                }, 3000);
            },

            // ============================================================
            // LANDING PAGE
            // ============================================================

            showLanding: function() {
                this.stopTimer();
                this.data.mode = 'landing';
                this.data.examMode = null;
                this.updateHeader();

                const subjectsWithNotes = Object.values(this.data.subjects).filter(subj =>
                    (subj.notes && Object.keys(subj.notes).some(topicId => subj.notes[topicId] && subj.notes[topicId].trim() !== '')) ||
                    (subj.topicImages && Object.keys(subj.topicImages).some(topicId => subj.topicImages[topicId]?.length > 0))
                );

                document.getElementById('app-container').innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full p-4">
                        <div class="text-center mb-8">
                            <i class="fas fa-graduation-cap text-6xl text-green-600 mb-4"></i>
                            <h2 class="text-3xl font-bold text-gray-800 mb-2">Welcome to the CBT Portal</h2>
                            <p class="text-gray-600">Select your role to continue</p>
                        </div>

                        ${subjectsWithNotes.length > 0 ? `
                        <div class="w-full max-w-2xl mb-6">
                            <h3 class="text-lg font-bold text-gray-700 mb-3 flex items-center gap-2">
                                <i class="fas fa-book-open text-blue-500"></i>
                                Available Study Materials
                            </h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                ${subjectsWithNotes.map(subj => {
                                    const noteCount = subj.notes ? Object.keys(subj.notes).filter(t => subj.notes[t]?.trim()).length : 0;
                                    const imageCount = subj.topicImages ? Object.values(subj.topicImages).flat().length : 0;
                                    return `
                                        <div onclick="event.preventDefault(); app.showSubjectNotes('${subj.id}')" class="note-card cursor-pointer">
                                            <i class="fas fa-book"></i>
                                            <h4 class="font-bold">${subj.name}</h4>
                                            <p class="text-sm opacity-90">${noteCount} topics with notes, ${imageCount} topic images</p>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                        ` : ''}

                        <div class="grid grid-cols-1 md:grid-cols-1 gap-6 w-full max-w-md">
                            <button onclick="event.preventDefault(); app.showCandidateOptions()" class="group bg-white p-8 rounded-xl shadow-md hover:shadow-xl transition border text-center">
                                <div class="bg-blue-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 group-hover:bg-blue-200">
                                    <i class="fas fa-user-graduate text-2xl text-blue-600"></i>
                                </div>
                                <h3 class="text-xl font-bold text-gray-800">Candidate</h3>
                                <p class="text-gray-500 mt-2">Take the examination</p>
                            </button>
                        </div>
                    </div>`;
            },

            // ============================================================
            // STUDY MATERIALS (Notes & Images)
            // ============================================================

            showSubjectNotes: function(subjectId) {
                const subj = this.data.subjects[subjectId];
                if (!subj) return;

                const topicsWithMaterials = subj.topics.filter(t =>
                    (subj.notes && subj.notes[t.id] && subj.notes[t.id].trim() !== '') ||
                    (subj.topicImages && subj.topicImages[t.id] && subj.topicImages[t.id].length > 0)
                );

                if (topicsWithMaterials.length === 0) {
                    this.showNotification('No notes or images available for this subject', 'info');
                    return;
                }

                document.querySelectorAll('.topic-checkbox').forEach(checkbox => {
                    const topicId = checkbox.value;
                    const qtyInput = document.querySelector(`.topic-quantity[data-topic-id="${topicId}"]`);
                    if (qtyInput) {
                        const updateQtyState = () => {
                            if (checkbox.checked) {
                                qtyInput.disabled = false;
                                let currentVal = parseInt(qtyInput.value);
                                let maxVal = parseInt(qtyInput.max);
                                if (isNaN(currentVal) || currentVal < 1) qtyInput.value = 1;
                                if (currentVal > maxVal) qtyInput.value = maxVal;
                            } else {
                                qtyInput.disabled = true;
                                qtyInput.value = 0;
                            }
                        };
                        checkbox.addEventListener('change', updateQtyState);
                        qtyInput.addEventListener('input', function() {

                            let maxVal = parseInt(this.max);
                            if (isNaN(val)) val = 1;
                            if (val < 0) val = 0;

                        });

                });

            // ============================================================
            // START EXAM

            startTestPrep: function() {
                const nameInput = document.getElementById('candidate-name');
                const subjectInput = document.getElementById('exam-subject');

                if (nameInput) this.data.candidateName = nameInput.value;
                if (!subjectInput) { this.showNotification('No subject selected.', 'error'); return; }

                const subject = this.data.subjects[subjectInput.value];
                this.data.currentSubjectId = subjectInput.value;

                // Custom duration
                let customDurationMinutes = null;
                if (this.data.examMode === 'practice') {
                    const customDurationInput = document.getElementById('custom-duration-input');
                    if (customDurationInput && customDurationInput.value) {
                        const parsed = parseInt(customDurationInput.value, 10);
                        if (!isNaN(parsed) && parsed > 0 && parsed <= 999) {
                            customDurationMinutes = parsed;
                        }
                    }
                }

                // Gather topic selections and quantities
                const selectedTopics = [];
                const topicQuantityMap = {};

                document.querySelectorAll('input[name="exam-topic"]:checked').forEach(cb => {
                    const topicId = cb.value;
                    const qtyInput = document.querySelector(`.topic-quantity[data-topic-id="${topicId}"]`);
                    let qty = qtyInput ? parseInt(qtyInput.value) : 0;
                    if (isNaN(qty) || qty < 0) qty = 0;
                    if (qty > 0) {
                        selectedTopics.push(topicId);
                        topicQuantityMap[topicId] = qty;
                    }
                });

                let questionsToUse = [];

                if (selectedTopics.length === 0) {
                    questionsToUse = [...subject.questions];
                } else {
                    for (let topicId of selectedTopics) {
                        const topicQuestions = subject.questions.filter(q => q.topicId === topicId);
                        const requested = topicQuantityMap[topicId];
                        if (topicQuestions.length === 0) continue;
                        let numberOfQuestions = Math.min(requested, topicQuestions.length);
                        if (numberOfQuestions <= 0) continue;
                        const shuffled = [...topicQuestions];
                        for (let i = shuffled.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                        }
                        const selected = shuffled.slice(0, numberOfQuestions);
                        questionsToUse.push(...selected);
                    }
                }

                if (questionsToUse.length === 0) {
                    this.showNotification("No questions available.", "error");
                    return;
                }

                // Final shuffle
                for (let i = questionsToUse.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [questionsToUse[i], questionsToUse[j]] = [questionsToUse[j], questionsToUse[i]];
                }

                this.data.questions = questionsToUse;

                if (this.data.examMode === 'practice') {
                    if (customDurationMinutes !== null) {
                        this.data.examDuration = customDurationMinutes;
                    } else {
                        this.data.examDuration = subject.duration;
                    }
                }

                if (this.data.questions.length === 0) {
                    this.showNotification("No questions set.", "error");
                    return;
                }

                this.data.currentQuestionIndex = 0;
                this.data.userAnswers = {};
                this.data.answerRevealed = {};
                this.clearExamState();
                this.data.endTime = null; 

                if (this.data.examMode === 'practice') {
                    this.data.timeLeft = this.data.examDuration * 60;
                    this.startTimer();
                } else {
                    this.data.timeLeft = 0;
                }

                this.data.refreshLocked = true;
                document.body.style.overflow = 'hidden';
                document.documentElement.style.overflow = 'hidden';

                this.showTestInterface();
            },

            // ============================================================
            // TIMER
            // ============================================================

            startTimer: function() {
    if (this.data.timer) clearInterval(this.data.timer);
    
    // If resuming, endTime is already set. Otherwise, calculate it.
    if (!this.data.endTime) {
        this.data.endTime = Date.now() + this.data.timeLeft * 1000;
    }

    this.data.timer = setInterval(() => {
        const remaining = Math.max(0, Math.round((this.data.endTime - Date.now()) / 1000));
        
        // Only update UI if the second actually changed (saves performance)
        if (remaining === this.data.timeLeft) return;
        
        this.data.timeLeft = remaining;
        this.updateTimerDisplay();
        this.saveExamState(); // Keep the resume state in sync
        
        if (remaining <= 0) {
            clearInterval(this.data.timer);
            this.data.timer = null;
            this.submitTest();
        }
    }, 250); // Poll 4x a second for extreme accuracy
},

            stopTimer: function() {
    if (this.data.timer) clearInterval(this.data.timer);
    this.data.timer = null;
    this.data.endTime = null; // Reset timestamp so next exam starts fresh
},

            updateTimerDisplay: function() {
                const el = document.getElementById('timer-display');
                if (el) {
                    const m = Math.floor(this.data.timeLeft / 60);
                    const s = this.data.timeLeft % 60;
                    el.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                    if (this.data.timeLeft < 60) el.classList.add('text-red-500', 'animate-pulse');
                }

                       submitTheoryImage: async function(qId) {
                const fileInput = document.getElementById(`theory-image-input-${qId}`);
                const file = fileInput.files[0];
                if (!file) return;

                const q = this.data.questions.find(q => String(q.id) === String(qId));
                if (!q) return;

                const btn = document.getElementById(`submit-image-btn-${qId}`);
                btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Processing Image...';
                btn.disabled = true;

                // 1. COMPRESS the image first to prevent "Request Entity Too Large" errors
                let imageBase64 = null;
                try {
                    // Compress to max 1000x1000 pixels and 70% quality (usually ~100KB)
                    const compressedFile = await compressImage(file, 1000, 1000, 0.7);
                    
                    const reader = new FileReader();
                    imageBase64 = await new Promise((resolve, reject) => {
                        reader.onload = () => resolve(reader.result);
                        reader.onerror = error => reject(error);
                        reader.readAsDataURL(compressedFile);
                    });
                } catch (err) {
                    this.showNotification("Error processing image file.", "error");
                    btn.innerHTML = '<i class="fas fa-magic mr-2"></i>Submit for AI Grading';
                    btn.disabled = false;
                    return;
                }
                
                // 2. PRACTICE MODE: Save the compressed Base64 string
                if (this.data.examMode === 'practice') {
                    this.data.userAnswers[String(q.id)] = imageBase64; 
                    this.saveExamState();
                    this.showNotification("Image saved. It will be graded when you submit the exam.", "success");
                    btn.innerHTML = '<i class="fas fa-check mr-2"></i>Image Saved';
                    return; 
                }

                // 3. STUDY MODE: Send compressed image to AI immediately
                this.showNotification("AI is reading the handwriting from your image...", "info");

                try {
                    const response = await fetch('/api/ai-brain', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            imageBase64: imageBase64,
                            referenceAnswer: q.explanation || q.correct || "General knowledge",
                            maxMarks: q.maxMarks || 10,
                            isImage: true 
                        })
                    });

                    // Check if the server returned HTML (like an error page) instead of JSON
                    const textResponse = await response.text();
                    let result;
                    try {
                        result = JSON.parse(textResponse);
                    } catch (e) {
                        throw new Error("Server error. The image might still be too large, or the AI is down.");
                    }

                    if (!response.ok || result.score === undefined) {
                        throw new Error(result.error || "AI failed to grade.");
                    }

                    this.data.userAnswers[String(q.id)] = imageBase64; 
                    this.data.answerRevealed[String(q.id)] = {
                        isCorrect: result.score >= ((q.maxMarks || 10) * 0.4), 
                        score: result.score,
                        explanation: `Model Answer:\n\n"${q.explanation}"\n\nAI Feedback: ${result.reason}\n\nAI Transcription: "${result.transcription || 'N/A'}"`
                    };
                    
                    this.saveExamState();
                    this.renderQuestion(); 
                    this.showNotification(`Graded: ${result.score}/${q.maxMarks}`, 'success');

                } catch (error) {
                    console.error(error);
                    this.showNotification("Error: " + error.message, "error");
                    btn.innerHTML = '<i class="fas fa-magic mr-2"></i>Submit for AI Grading';
                    btn.disabled = false;
                }
            },

         submitTheoryText: async function(qId) {
                const textarea = document.getElementById(`theory-text-input-${qId}`);
                const answerText = textarea.value.trim();
                if (!answerText) {
                    this.showNotification("Please type an answer before saving.", "warning");
                    return;
                }

                const q = this.data.questions.find(q => String(q.id) === String(qId));
                if (!q) return;

                this.data.userAnswers[String(q.id)] = answerText; 

                // PRACTICE MODE: Save without grading
                if (this.data.examMode === 'practice') {
                    this.saveExamState();
                    this.showNotification("Answer saved. You can edit and save again.", "success");
                    
                    const btn = document.getElementById(`submit-text-btn-${qId}`);
                    btn.innerHTML = '<i class="fas fa-check mr-2"></i>Answer Saved!';
                    
                    // Reset button after 2 seconds so they know they can save again
                    setTimeout(() => {
                        btn.innerHTML = '<i class="fas fa-save mr-2"></i>Save Answer';
                    }, 2000);
                    
                    return; 
                }

                // STUDY MODE: Grade immediately
                const btn = document.getElementById(`submit-text-btn-${qId}`);
                btn.innerHTML = '<i class="fas fa-brain fa-spin mr-2"></i>AI is grading...';
                btn.disabled = true;
                this.showNotification("AI is analyzing your answer...", "info");

                try {
                    const response = await fetch('/api/ai-brain', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            studentAnswer: answerText,
                            referenceAnswer: q.explanation || q.correct || "General knowledge",
                            maxMarks: q.maxMarks || 10
                        })
                    });

                    const result = await response.json();

                    if (!response.ok || result.score === undefined) {
                        throw new Error(result.error || "AI failed to return a score.");
                    }

                    this.data.answerRevealed[String(q.id)] = {
                        isCorrect: result.score >= ((q.maxMarks || 10) * 0.4), 
                        score: result.score,
                        explanation: `Model Answer:\n\n"${q.explanation}"\n\nAI Feedback: ${result.reason}`
                    };
                    
                    this.saveExamState();
                    this.renderQuestion();

            // Open full-screen explanation
            window.openFullScreenExplanation = function(btnElement) {
                const container = btnElement.closest('.explanation-box, .bg-blue-50, .bg-white.p-4.rounded-lg.border-l-4');
                if (!container) return;
                const clone = container.cloneNode(true);
                const btnInClone = clone.querySelector('.fullscreen-explain-btn');
                if (btnInClone) btnInClone.remove();

                const modalContent = document.querySelector('#fullscreen-explain-modal .modal-content');
                modalContent.className = 'modal-content theme-white';

                document.getElementById('fullscreen-explain-body').innerHTML = clone.innerHTML;
                document.getElementById('fullscreen-explain-modal').classList.add('open');
                if (window.MathJax && MathJax.typesetPromise) {
                    MathJax.typesetPromise([document.getElementById('fullscreen-explain-body')]).catch(() => {});
                }
            };

            // Theme toggle
            window.toggleExplanationTheme = function(btnElement) {
                const modalContent = btnElement.closest('.modal-content');
                if (!modalContent) return;

                const themes = ['theme-white', 'theme-dark', 'theme-sepia'];
                let currentIndex = themes.findIndex(t => modalContent.classList.contains(t));
                let nextIndex = (currentIndex + 1) % themes.length;
                themes.forEach(t => modalContent.classList.remove(t));
                modalContent.classList.add(themes[nextIndex]);
            };

            // Inject buttons into explanation boxes
            function injectBlinkButtons() {
                document.querySelectorAll('.explanation-box').forEach(container => {
                    if (container.querySelector('.fullscreen-explain-btn')) return;

                    let target = container.querySelector('.bg-white.p-4.rounded-lg.border-l-4.border-blue-500');
                    if (!target) target = container.querySelector('.bg-blue-50');
                    if (!target) target = container;

                    if (target.querySelector('.fullscreen-explain-btn')) return;
                    if (target.textContent.trim().length < 5) return;

                    const btn = document.createElement('button');
                    btn.className = 'fullscreen-explain-btn blink-btn';
                    btn.innerHTML = '<i class="fas fa-expand"></i> View in full screen';
                    btn.onclick = function(e) {
                        e.preventDefault();
                        window.openFullScreenExplanation(this);
                    };
                    target.appendChild(btn);
                });

                // Remove buttons from green boxes
                document.querySelectorAll('.bg-green-50 .fullscreen-explain-btn').forEach(btn => btn.remove());
            }

            // Patch render methods
            const methodsToPatch = ['renderQuestion', 'showResult', 'showFullReview'];
            methodsToPatch.forEach(methodName => {
                const original = app[methodName];
                if (typeof original === 'function') {
                    app[methodName] = function() {
                        const result = original.apply(this, arguments);
                        setTimeout(injectBlinkButtons, 400);
                        return result;
                    };
                }
            });

            setTimeout(injectBlinkButtons, 500);
        })();
    </script>

<!-- BACK-BUTTON / HISTORY NAVIGATION MANAGER                      -->
<!-- Drop-in: no changes to existing app functions required        -->
<!-- ============================================================ -->
<script>
(function () {
    'use strict';

    // ------------------------------------------------------------
    // Wait for `app` to exist, then wire everything up
    // ------------------------------------------------------------
    function boot() {
        if (typeof app === 'undefined' || !app || typeof app.showLanding !== 'function') {
            setTimeout(boot, 100);
            return;
        }

        // ========================================================
        // NAV MANAGER
        // ========================================================
        const nav = {
            stack: ['landing'],
            _suppress: false,   // set true while we programmatically re-render
            _booted: false,

            // Push a new entry + render via the wrapped function
            push: function (screenKey, state, renderFn) {
                if (this._booted && this.stack[this.stack.length - 1] === screenKey) {
                    // Already on this screen — just render (no new history entry)
                    renderFn();
                    return;
                }
                this.stack.push(screenKey);
                history.pushState(Object.assign({ screen: screenKey }, state || {}), '', '#' + screenKey);
                renderFn();
            },

            // Replace current entry (no new history entry) — for re-renders / landing
            replace: function (screenKey, state, renderFn) {
                if (this.stack.length === 0) this.stack.push(screenKey);
                else this.stack[this.stack.length - 1] = screenKey;
                history.replaceState(Object.assign({ screen: screenKey }, state || {}), '', '#' + screenKey);
                renderFn();
            },

            // Called from popstate — dispatch to the right render function
            handlePop: function (state) {
                const screen = (state && state.screen) || 'landing';
                this._suppress = true;
                try {
                    switch (screen) {
                        case 'landing':
                            app.showLanding();
                            break;
                        case 'candidate-options':
                            app.showCandidateOptions();
                            break;
                        case 'login-practice':
                            app.showCandidateLogin('practice');
                            break;
                        case 'login-study':
                            app.showCandidateLogin('study');
                            break;
                        case 'notes-browser':
                            if (state.subjectId) app.showSubjectNotes(state.subjectId);
                            else app.showLanding();
                            break;
                        case 'result':
                            if (app.data.lastResults) {
                                const r = app.data.lastResults;
                                app.showSimplifiedResult(r.score, r.total, r.percentage);
                            } else {
                                app.showLanding();
                            }
                            break;
                        case 'review':
                            if (app.data.lastResults) app.showFullReview();
                            else app.showLanding();
                            break;
                        case 'test':
                            // They back-buttoned out of an exam.
                            // Re-trap them — exam state is still live.
                            if (app.data.mode === 'test') {
                                history.pushState({ screen: 'test' }, '', '#test');
                                app.showNotification(
                                    'You are in an exam. Use the Submit button to finish.',
                                    'warning'
                                );
                            } else {
                                app.showLanding();
                            }
                            break;
                        default:
                            app.showLanding();
                    }
                } finally {
                    // Release suppression after a tick so any nested renders settle
                    setTimeout(() => { nav._suppress = false; }, 0);
                }
            }
        };

        // ========================================================
        // WRAP EXISTING app.* FUNCTIONS
        // Original bodies are preserved; we just intercept the
        // *navigation* calls and mirror them into history.
        // ========================================================

        // -------- showLanding --------
        const _origShowLanding = app.showLanding.bind(app);
        app.showLanding = function () {
            if (nav._suppress) {
                // Called from popstate — just render, don't touch history
                return _origShowLanding();
            }
            nav.replace('landing', {}, _origShowLanding);
        };

        // -------- showCandidateOptions --------
        const _origShowCandidateOptions = app.showCandidateOptions.bind(app);
        app.showCandidateOptions = function () {
            if (nav._suppress) return _origShowCandidateOptions();
            nav.push('candidate-options', {}, _origShowCandidateOptions);
        };

        // -------- showCandidateLogin --------
        const _origShowCandidateLogin = app.showCandidateLogin.bind(app);
        app.showCandidateLogin = function (mode) {
            if (nav._suppress) return _origShowCandidateLogin(mode);
            nav.push('login-' + mode, { mode: mode }, () => _origShowCandidateLogin(mode));
        };

        // -------- showSubjectNotes --------
        const _origShowSubjectNotes = app.showSubjectNotes.bind(app);
        app.showSubjectNotes = function (subjectId) {
            if (nav._suppress) return _origShowSubjectNotes(subjectId);
            nav.push('notes-browser', { subjectId: subjectId }, () => _origShowSubjectNotes(subjectId));
        };

        // -------- showSimplifiedResult --------
        const _origShowSimplifiedResult = app.showSimplifiedResult.bind(app);
        app.showSimplifiedResult = function (score, total, percentage) {
            if (nav._suppress) return _origShowSimplifiedResult(score, total, percentage);
            // Use REPLACE so the back button from results goes to the login
            // screen, not the just-finished exam.
            nav.replace('result', { score: score }, () => _origShowSimplifiedResult(score, total, percentage));
        };

        // -------- showFullReview --------
        const _origShowFullReview = app.showFullReview.bind(app);
        app.showFullReview = function () {
            if (nav._suppress) return _origShowFullReview();
            nav.push('review', {}, _origShowFullReview);
        };

        // -------- showTestInterface (called once when exam starts) --------
        const _origShowTestInterface = app.showTestInterface.bind(app);
        app.showTestInterface = function () {
            if (nav._suppress) return _origShowTestInterface();
            nav.push('test', {}, _origShowTestInterface);
        };

        // ========================================================
        // POPSTATE LISTENER
        // ========================================================
        window.addEventListener('popstate', function (e) {
            // Special case: exam in progress — trap the back button
            if (app.data.mode === 'test') {
                // Re-push the test entry so back again still fires popstate
                history.pushState({ screen: 'test' }, '', '#test');
                if (confirm('Leave the exam? Your answers will be lost.')) {
                    // User confirmed — actually leave
                    app.data.mode = 'landing';
                    app.data.questions = [];
                    app.data.userAnswers = {};
                    app.data.answerRevealed = {};
                    if (app.data.timer) clearInterval(app.data.timer);
                    nav.stack = ['landing'];
                    history.replaceState({ screen: 'landing' }, '', '#landing');
                    nav._suppress = true;
                    app.showLanding();
                    setTimeout(() => { nav._suppress = false; }, 0);
                }
                return;
            }

            // Normal screens — restore the target screen
            const idx = nav.stack.indexOf((e.state && e.state.screen) || 'landing');
            if (idx >= 0) nav.stack = nav.stack.slice(0, idx + 1);
            else nav.stack = [(e.state && e.state.screen) || 'landing'];
            nav.handlePop(e.state);
        });

        // ========================================================
        // SEED HISTORY WITH LANDING
        // ========================================================
        history.replaceState({ screen: 'landing' }, '', '#landing');
        nav.stack = ['landing'];
        nav._booted = true;

        // ========================================================
        // BOOT: render landing (bypassing history push via suppress)
        // ========================================================
        nav._suppress = true;
        _origShowLanding();
        setTimeout(() => { nav._suppress = false; }, 0);

        // ========================================================
        // EXPOSE for debugging (optional)
        // ========================================================
        window.nav = nav;
        console.log('✅ Back-button navigation manager ready');
    }

    boot();
})();
</script>

<script>
(function(){
  // Fix the Verse Popup colors dynamically
  function applyVerseTheme(){
    if (!window.app || !app.showVersePopup) return;
    const orig = app.showVersePopup;
    
    app.showVersePopup = function(){
      // Remove any existing popups to avoid duplicates
      const old = document.getElementById('verse-popup');
      if (old) old.remove();
      
      // Call the original function to generate the popup
      const r = orig.apply(this, arguments);
      
      // Style it to match Midnight Scholar
      const popup = document.getElementById('verse-popup');
      if (popup) {
        const card = popup.firstElementChild;
        const results = this.data.results;
        const pct = results && results.length ? results[results.length-1].percentage : 0;
        const good = pct >= 50;
        
        // Apply new Midnight Scholar colors
        card.style.background = good
          ? 'linear-gradient(135deg, #1E293B, #4F46E5)'
          : 'linear-gradient(135deg, #0F172A, #3730A3)';

        const h2 = card.querySelector('h2');
        if (h2) h2.style.color = '#F59E0B'; // Amber title
        
        const btn = card.querySelector('button');
        if (btn) { 
          btn.style.background = '#F59E0B'; 
          btn.style.color = '#0F172A'; 
        }
      }
      return r;
    };
  }

  // Wait for the app object to be ready, then apply the patch
  const checkApp = setInterval(() => {
    if (window.app) {
      clearInterval(checkApp);
      applyVerseTheme();
    }
  }, 100);
})();

    <!-- DYNAMIC MATHJAX FORMATTER FOR AI THEORY GRADING              -->
    <!-- Paste this right before </body>                              -->
    <!-- ============================================================ -->
    <script>
    (function() {
        // Wait for the app to be fully loaded
        const checkApp = setInterval(() => {
            if (window.app && app.submitTest) {
                clearInterval(checkApp);

                const originalSubmitTest = app.submitTest;

                app.submitTest = async function() {
                    const originalFetch = window.fetch;

                    // Intercept the network request to /api/ai-brain
                    window.fetch = async function(url, options) {
                        const response = await originalFetch.apply(this, arguments);

                        if (url.includes('/api/ai-brain') && options && options.body) {
                            try {
                                const body = JSON.parse(options.body);
                                // Only process if it's an image upload (MathJax is most needed here)
                                if (body.isImage) {
                                    const clonedResponse = response.clone();
                                    const data = await clonedResponse.json();
                                    
                                    // If the AI returned a transcription or reason, format it for MathJax
                                    if (data.transcription) {
                                        data.transcription = wrapMathForMathJax(data.transcription);
                                    }
                                    if (data.reason) {
                                        data.reason = wrapMathForMathJax(data.reason);
                                    }

                                    // Return the modified data as a new response
                                    return new Response(JSON.stringify(data), {
                                        status: response.status,
                                        statusText: response.statusText,
                                        headers: response.headers
                                    });
                                }
                            } catch (e) {
                                console.warn("Math formatting interceptor bypassed:", e);
                            }
                        }
                        return response;
                    };

                    // Run the original submitTest
                    try {
                        await originalSubmitTest.apply(this, arguments);
                    } finally {
                        // Always restore the original fetch to prevent memory leaks
                        window.fetch = originalFetch;
                    }
                };
            }
        }, 100);

        // The magic function that finds math and wraps it in \( \)
        function wrapMathForMathJax(text) {
            if (!text) return text;
            
            // 1. Temporarily replace existing LaTeX blocks so we don't double-wrap them
            let tempText = text.replace(/(\\\(.*?\\\)|\\\[.*?\\\])/g, '___MATH_BLOCK___');

            // 2. Add delimiters around common math patterns
            // (Greek letters, superscripts, subscripts, fractions, roots)
            tempText = tempText.replace(/([α-ωΑ-ΩπΔθ]|[\^_][a-zA-Z0-9]|\\frac\{.*?\}\{.*?\}|\\sqrt\{.*?\}|\b[a-zA-Z]\s*=\s*[^.,;\n]+)/g, '\\($1\\)');

            // 3. Restore the original LaTeX blocks
            tempText = tempText.replace(/___MATH_BLOCK___/g, (match) => {
                // Find the original block from the original text using regex
                const originalMatches = text.match(/(\\\(.*?\\\)|\\\[.*?\\\])/g);
                if (originalMatches && originalMatches.length > 0) {
                    return originalMatches.shift();
                }
                return match;
            });

            // 4. Clean up any accidental double-wrapping (e.g., \(\(x\)\))
            tempText = tempText.replace(/\\\(\\\((.*?)\\\)\\\)/g, '\\($1\\)');

            return tempText;
        }
    })();
    </script>
