<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>eduCBT — Computer Based Test</title>

  <!-- Tailwind (browser build) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Font Awesome 6.0.0 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

  <!-- Tesseract.js 5 — loaded but intentionally UNUSED (keep this tag) -->
  <script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <!-- MathJax config MUST come before MathJax itself -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]']],
        packages: { '[+]': ['mhchem', 'ams'] }
      },
      loader: { load: ['[tex]/mhchem'] },
      options: {
        ignoreHtmlClass: 'no-mathjax',
        processHtmlClass: 'mathjax'
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

  <!-- Styles: theme-aurora.css MUST load last -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/theme-aurora.css" />
</head>

<body class="flex flex-col">

  <!-- ===================== HEADER (~72px) ===================== -->
  <header id="app-header" class="bg-green-700 text-white shadow-lg flex items-center justify-between px-3 md:px-6">
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-11 h-11 rounded-xl bg-white/15 flex items-center justify-center shrink-0">
        <i class="fas fa-graduation-cap text-2xl"></i>
      </div>
      <div class="min-w-0">
        <div class="text-xl font-extrabold leading-tight tracking-tight">eduCBT</div>
        <div class="text-xs opacity-80 hidden sm:block">Computer Based Test Portal</div>
      </div>
    </div>
    <div id="header-actions" class="flex items-center gap-2 md:gap-4"></div>
  </header>

  <!-- ===================== APP CONTAINER ===================== -->
  <main id="app-container"></main>

  <!-- ===================== TOASTS ===================== -->
  <div id="toast-container" class="fixed top-20 left-1/2 -translate-x-1/2 z-[100001] flex flex-col gap-2 items-center pointer-events-none"></div>

  <!-- ===================== MOBILE QUESTION GRID MODAL ===================== -->
  <div id="mobile-grid-modal" class="cbt-modal hidden" onclick="if(event.target===this)this.classList.add('hidden')">
    <div class="bg-white border border-gray-200 rounded-2xl shadow-2xl w-full max-w-sm max-h-[80vh] flex flex-col overflow-hidden">
      <div class="flex items-center justify-between px-4 py-3 border-b border-gray-200">
        <h3 class="font-bold text-gray-800"><i class="fas fa-th mr-2"></i>Questions</h3>
        <button type="button" class="w-9 h-9 rounded-lg hover:bg-gray-100 text-gray-600" onclick="document.getElementById('mobile-grid-modal').classList.add('hidden')"><i class="fas fa-times"></i></button>
      </div>
      <div id="mobile-grid-container" class="p-4 grid grid-cols-5 gap-2 overflow-y-auto"></div>
    </div>
  </div>

  <!-- ===================== NOTE VIEWER MODAL ===================== -->
  <div id="note-viewer-modal" class="cbt-modal hidden" onclick="if(event.target===this)this.classList.add('hidden')">
    <div class="bg-white border border-gray-200 rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] flex flex-col overflow-hidden">
      <div class="flex items-center justify-between px-5 py-4 border-b border-gray-200">
        <h3 id="note-viewer-title" class="text-lg font-bold text-gray-800 min-w-0 break-words">Notes</h3>
        <button type="button" class="w-9 h-9 rounded-lg hover:bg-gray-100 text-gray-600 shrink-0" onclick="document.getElementById('note-viewer-modal').classList.add('hidden')"><i class="fas fa-times"></i></button>
      </div>
      <div id="note-viewer-content" class="note-content prose p-5 overflow-y-auto text-gray-800"></div>
    </div>
  </div>

  <!-- ===================== TOPIC IMAGE MODAL ===================== -->
  <div id="topic-image-modal" class="cbt-modal hidden" onclick="if(event.target===this)this.classList.add('hidden')">
    <div class="bg-white border border-gray-200 rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden">
      <div class="flex items-center justify-between px-5 py-4 border-b border-gray-200">
        <h3 id="topic-image-modal-title" class="text-lg font-bold text-gray-800 min-w-0 break-words">Topic Images</h3>
        <button type="button" class="w-9 h-9 rounded-lg hover:bg-gray-100 text-gray-600 shrink-0" onclick="document.getElementById('topic-image-modal').classList.add('hidden')"><i class="fas fa-times"></i></button>
      </div>
      <div class="overflow-y-auto">
        <div id="topic-image-gallery" class="image-gallery"></div>
      </div>
    </div>
  </div>

  <!-- ===================== REFERENCE IMAGE MODAL (imageViewer) ===================== -->
  <div id="image-modal" class="cbt-modal hidden" onclick="if(event.target===this)imageViewer.close()">
    <div class="bg-white border border-gray-200 rounded-2xl shadow-2xl w-full max-w-5xl max-h-[92vh] flex flex-col overflow-hidden">
      <div class="flex items-center justify-between px-5 py-4 border-b border-gray-200">
        <div class="min-w-0">
          <h3 id="image-modal-title" class="text-lg font-bold text-gray-800 break-words">Reference Images</h3>
          <span id="image-count" class="text-xs text-gray-500">0 images</span>
        </div>
        <button type="button" class="w-9 h-9 rounded-lg hover:bg-gray-100 text-gray-600 shrink-0" onclick="imageViewer.close()"><i class="fas fa-times"></i></button>
      </div>
      <div class="image-toolbar">
        <button type="button" onclick="imageViewer.zoomOut()"><i class="fas fa-search-minus mr-1"></i>Zoom Out</button>
        <button type="button" onclick="imageViewer.zoomIn()"><i class="fas fa-search-plus mr-1"></i>Zoom In</button>
        <button type="button" onclick="imageViewer.downloadAll()"><i class="fas fa-download mr-1"></i>Download All</button>
      </div>
      <div id="image-viewer-container" class="flex-1 overflow-auto">
        <div id="image-gallery" class="image-gallery"></div>
      </div>
      <div id="no-images-message" class="hidden p-10 text-center text-gray-500">
        <i class="fas fa-image text-5xl mb-3 opacity-50"></i>
        <p class="font-semibold">No reference images available for this subject.</p>
      </div>
    </div>
  </div>

  <!-- ===================== FULLSCREEN EXPLANATION MODAL ===================== -->
  <div id="fullscreen-explain-modal">
    <div class="modal-content theme-white">
      <div class="modal-header">
        <h3>📖 Full Screen Explanation</h3>
        <div class="modal-actions">
          <button type="button" class="theme-btn" title="Change theme" onclick="toggleExplanationTheme(this)">💡</button>
          <button type="button" class="close-btn" title="Close" onclick="closeFullScreenExplanation()">✕</button>
        </div>
      </div>
      <div class="modal-body" id="fullscreen-explain-body"></div>
    </div>
  </div>

  <!-- ===================== SCRIPTS (order matters — all deferred) ===================== -->
  <script defer src="js/image-viewer.js"></script>
  <script defer src="js/app-core.js"></script>
  <script defer src="js/app-exam.js"></script>
  <script defer src="js/app-ai.js"></script>
  <script defer src="js/app-results.js"></script>
  <script defer src="question-banks/probability-bank.js"></script>
  <script defer src="question-banks/physics-bank.js"></script>
  <script defer src="question-banks/bible-bank.js"></script>
  <script defer src="question-banks/linear-algebra-bank.js"></script>
  <script defer src="question-banks/question-loader.js"></script>
  <script defer src="js/explanation-viewer.js"></script>
  <script defer src="js/navigation.js"></script>
  <script defer src="js/verse-popup.js"></script>
  <script defer src="js/math-formatter.js"></script>
  <script defer src="js/init.js"></script>
</body>
</html>
