<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academy-Cbt</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)']],
    displayMath: [['\\[', '\\]']],
    packages: { '[+]': ['mhchem', 'ams'] }
  },
  options: {
    ignoreHtmlClass: 'no-mathjax',
    processHtmlClass: 'mathjax'
  }
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/theme-aurora.css">
</head>
<body class="bg-gray-50">

<header class="bg-green-700 text-white shadow-lg sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-10 h-10 rounded-xl bg-white/15 flex items-center justify-center shrink-0">
        <i class="fas fa-graduation-cap text-xl"></i>
      </div>
      <div class="min-w-0">
        <h1 class="font-bold text-lg leading-tight truncate">eduCBT</h1>
        <p class="text-[11px] text-green-100 leading-tight truncate">Aurora Obsidian · Computer Based Testing</p>
      </div>
    </div>
    <nav id="header-actions" class="flex items-center gap-2 flex-wrap justify-end"></nav>
  </div>
</header>

<div id="app-container" class="mathjax max-w-7xl mx-auto p-4 md:p-6"></div>

<!-- ============ NOTE VIEWER MODAL ============ -->
<div id="note-viewer-modal" class="hidden fixed inset-0 z-[900] bg-black/60 backdrop-blur-sm p-3 md:p-8 overflow-y-auto">
  <div class="bg-white rounded-2xl shadow-2xl max-w-4xl mx-auto overflow-hidden">
    <div class="flex items-center justify-between gap-3 p-4 border-b border-gray-200 bg-gray-50">
      <h2 id="note-viewer-title" class="font-bold text-lg text-gray-800 min-w-0 truncate">Notes</h2>
      <button onclick="document.getElementById('note-viewer-modal').classList.add('hidden')" class="w-9 h-9 rounded-lg bg-red-500 text-white hover:bg-red-600 shrink-0" aria-label="Close notes"><i class="fas fa-times"></i></button>
    </div>
    <div id="note-viewer-content" class="mathjax note-content p-5 md:p-7 text-gray-800 leading-relaxed max-h-[75vh] overflow-y-auto"></div>
  </div>
</div>

<!-- ============ TOPIC IMAGE MODAL ============ -->
<div id="topic-image-modal" class="hidden fixed inset-0 z-[900] bg-black/60 backdrop-blur-sm p-3 md:p-8 overflow-y-auto">
  <div class="bg-white rounded-2xl shadow-2xl max-w-5xl mx-auto overflow-hidden">
    <div class="flex items-center justify-between gap-3 p-4 border-b border-gray-200 bg-gray-50">
      <h2 id="topic-image-modal-title" class="font-bold text-lg text-gray-800 min-w-0 truncate">Topic Images</h2>
      <button onclick="document.getElementById('topic-image-modal').classList.add('hidden')" class="w-9 h-9 rounded-lg bg-red-500 text-white hover:bg-red-600 shrink-0" aria-label="Close images"><i class="fas fa-times"></i></button>
    </div>
    <div id="topic-image-gallery" class="grid grid-cols-2 md:grid-cols-3 gap-3 p-5"></div>
  </div>
</div>

<!-- ============ REFERENCE IMAGE VIEWER MODAL ============ -->
<div id="image-modal" class="hidden fixed inset-0 z-[900] bg-black/75 backdrop-blur-sm p-3 md:p-6 overflow-y-auto">
  <div class="bg-white rounded-2xl shadow-2xl max-w-5xl mx-auto overflow-hidden">
    <div class="flex items-center justify-between gap-3 p-4 bg-gray-50 border-b border-gray-200">
      <div class="min-w-0">
        <h2 id="image-modal-title" class="font-bold text-lg text-gray-800 truncate">Images</h2>
        <p id="image-count" class="text-xs text-gray-500">0 images</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="imageViewer.zoomOut()" class="w-9 h-9 rounded-lg bg-gray-200 text-gray-700 hover:bg-gray-300" title="Zoom out"><i class="fas fa-search-minus"></i></button>
        <button onclick="imageViewer.zoomIn()" class="w-9 h-9 rounded-lg bg-gray-200 text-gray-700 hover:bg-gray-300" title="Zoom in"><i class="fas fa-search-plus"></i></button>
        <button onclick="imageViewer.downloadAll()" class="w-9 h-9 rounded-lg bg-purple-600 text-white hover:bg-purple-700" title="Download all"><i class="fas fa-download"></i></button>
        <button onclick="imageViewer.close()" class="w-9 h-9 rounded-lg bg-red-500 text-white hover:bg-red-600" title="Close"><i class="fas fa-times"></i></button>
      </div>
    </div>
    <div class="image-toolbar flex items-center gap-2 px-4 py-2 border-b border-gray-200 text-xs text-gray-500">
      <i class="fas fa-images"></i><span>Click any thumbnail to view full size · use the toolbar to zoom</span>
    </div>
    <div id="image-viewer-container" class="p-4">
      <div id="image-gallery" class="grid grid-cols-2 md:grid-cols-3 gap-3"></div>
      <div id="no-images-message" class="hidden text-center py-16">
        <div class="text-5xl mb-3">🖼️</div>
        <p class="text-gray-500 font-medium">No reference images uploaded for this subject yet.</p>
      </div>
    </div>
  </div>
</div>

<!-- ============ MOBILE GRID MODAL ============ -->
<div id="mobile-grid-modal" class="hidden fixed inset-0 z-[900] bg-black/70 backdrop-blur-sm p-4">
  <div class="bg-white rounded-2xl shadow-2xl max-w-md mx-auto mt-16 overflow-hidden">
    <div class="flex items-center justify-between p-4 border-b border-gray-200 bg-gray-50">
      <h2 class="font-bold text-gray-800">Question Navigator</h2>
      <button onclick="document.getElementById('mobile-grid-modal').classList.add('hidden')" class="w-9 h-9 rounded-lg bg-red-500 text-white hover:bg-red-600"><i class="fas fa-times"></i></button>
    </div>
    <div id="mobile-grid-container" class="grid grid-cols-5 gap-2 p-4 max-h-[60vh] overflow-y-auto"></div>
  </div>
</div>

<!-- ============ FULLSCREEN EXPLANATION MODAL ============ -->
<div id="fullscreen-explain-modal">
  <div class="modal-content theme-white">
    <div class="explain-modal-header">
      <span>📖 Full Screen Explanation</span>
      <div class="explain-modal-actions">
        <button onclick="toggleExplanationTheme(this)" title="Cycle theme (white / dark / sepia)">💡</button>
        <button onclick="document.getElementById('fullscreen-explain-modal').classList.remove('open')" title="Close">✕</button>
      </div>
    </div>
    <div id="fullscreen-explain-body" class="mathjax"></div>
  </div>
</div>

<!-- Toast layer -->
<div id="toast-layer" class="fixed top-20 right-4 z-[999999] flex flex-col gap-2 items-end pointer-events-none"></div>

<!-- ============ SCRIPTS (exact deferred load order) ============ -->
<script defer src="js/image-viewer.js"></script>
<script defer src="js/app-core.js"></script>
<script defer src="js/app-exam.js"></script>
<script defer src="js/app-ai.js"></script>
<script defer src="js/app-results.js"></script>


<!-- banks first -->
<script defer src="question-banks/physics/physics-bank.js"></script>
<script defer src="question-banks/probability/probability-bank.js"></script>
<script defer src="question-banks/bible-studies/bible-bank.js"></script>
<script defer src="question-banks/linear-algebra/linear-algebra-bank.js"></script>
<!-- then the per-subject notes.js files -->
<script defer src="question-banks/physics/notes.js"></script>
<script defer src="question-banks/probability/notes.js"></script>
<script defer src="question-banks/bible-studies/notes.js"></script>
<script defer src="question-banks/linear-algebra/notes.js"></script>
<!-- loader last -->
<script defer src="question-banks/question-loader.js"></script>

  
<script defer src="js/explanation-viewer.js"></script>
<script defer src="js/navigation.js"></script>
<script defer src="js/verse-popup.js"></script>
<script defer src="js/math-formatter.js"></script>
<script defer src="js/init.js"></script>
</body>
</html>
