<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>eduCBT — Admin Studio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<!-- Marked.js for Markdown parsing -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
  options: { ignoreHtmlClass: 'no-mathjax' }
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<style>
  :root { --bg-dark: #070A12; --panel-dark: #0B1020; --border-dark: #1e2740; --text-main: #E7EEF6; --text-muted: #8598AC; --accent: #f59e0b; }
  body { background-color: var(--bg-dark); color: var(--text-main); font-family: ui-sans-serif, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border-dark); border-radius: 4px; }
  .input-dark { background-color: #101830; border: 1px solid var(--border-dark); color: var(--text-main); border-radius: 8px; padding: 10px 12px; width: 100%; font-size: 14px; transition: border-color 0.2s; }
  .input-dark:focus { outline: none; border-color: var(--accent); }
  .code-editor { font-family: ui-monospace, monospace; font-size: 13px; line-height: 1.5; resize: vertical; background-color: #05080f; }
  .tab-btn { flex: 1; padding: 12px 0; font-size: 13px; font-weight: 700; color: var(--text-muted); border-bottom: 2px solid transparent; transition: all 0.2s; }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  
  /* Markdown & LaTeX Preview Styling */
  .preview-content { font-size: 15px; line-height: 1.6; }
  .preview-content h1, .preview-content h2, .preview-content h3 { font-weight: 700; margin: 1em 0 0.5em; color: #fff; }
  .preview-content h1 { font-size: 1.5em; border-bottom: 1px solid var(--border-dark); padding-bottom: 5px; }
  .preview-content h2 { font-size: 1.3em; }
  .preview-content p { margin-bottom: 1em; color: var(--text-muted); }
  .preview-content ul, .preview-content ol { margin: 1em 0 1em 1.5em; color: var(--text-muted); }
  .preview-content ul { list-style-type: disc; }
  .preview-content ol { list-style-type: decimal; }
  .preview-content blockquote { border-left: 4px solid var(--accent); padding: 10px; margin: 1em 0; color: #cbd5e1; font-style: italic; background: rgba(245,158,11,0.05); border-radius: 0 8px 8px 0; }
  .preview-content strong { color: #fff; font-weight: 700; }
  .preview-content table { width: 100%; border-collapse: collapse; margin: 1em 0; font-size: 14px; }
  .preview-content th, .preview-content td { border: 1px solid var(--border-dark); padding: 8px 12px; text-align: left; }
  .preview-content th { background: #101830; color: #fff; font-weight: 700; }
  .preview-content hr { border: 0; border-top: 1px solid var(--border-dark); margin: 1.5em 0; }
  
  /* Sidebar */
  #sidebar { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); }
  #sidebar.open { transform: translateX(0); }
  #sidebar-overlay { transition: opacity 0.3s ease; opacity: 0; pointer-events: none; }
  #sidebar-overlay.open { opacity: 1; pointer-events: auto; }

  .svg-item-btn { transition: all 0.2s; }
  .svg-item-btn.active { border-color: var(--accent); background: rgba(245,158,11,0.1); }
</style>
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden">

  <header class="flex-none bg-[#0B1020] border-b border-[#1e2740] px-4 py-3 flex items-center justify-between z-20">
    <div class="flex items-center gap-3">
      <button onclick="toggleSidebar()" class="w-10 h-10 rounded-xl bg-[#101830] border border-[#1e2740] flex items-center justify-center text-gray-300 active:scale-95"><i class="fas fa-bars"></i></button>
      <div>
        <h1 class="font-extrabold text-sm leading-tight">Studio</h1>
        <p id="current-subject-label" class="text-[11px] text-[#8598AC] leading-tight truncate max-w-[150px]">Loading...</p>
      </div>
    </div>
    <button onclick="openModal('github-modal')" class="w-10 h-10 rounded-xl bg-[#101830] border border-[#1e2740] flex items-center justify-center text-gray-300 active:scale-95"><i class="fab fa-github text-lg"></i></button>
  </header>

  <main class="flex-grow flex flex-col overflow-hidden">
    <div class="flex-none flex border-b border-[#1e2740] bg-[#0B1020]">
      <button onclick="switchTab('notes')" id="tab-notes" class="tab-btn active"><i class="fas fa-file-lines mr-1.5"></i> Notes</button>
      <button onclick="switchTab('svg')" id="tab-svg" class="tab-btn"><i class="fas fa-image mr-1.5"></i> SVG Studio</button>
      <button onclick="switchTab('preview')" id="tab-preview" class="tab-btn"><i class="fas fa-eye mr-1.5"></i> Preview</button>
    </div>

    <div class="flex-grow overflow-y-auto p-4 pb-24">
      
      <!-- TAB 1: NOTES -->
      <div id="pane-notes" class="tab-pane active h-full flex flex-col">
        <div class="mb-3">
          <label class="text-xs font-bold text-[#8598AC] uppercase">Topic Name (Editable)</label>
          <input type="text" id="topic-name-input" class="input-dark mt-1 font-bold" oninput="updateTopicName(this.value)">
        </div>
        <div class="mb-2 flex items-center justify-between">
          <label class="text-xs font-bold text-[#8598AC] uppercase">Markdown & LaTeX</label>
          <div class="flex gap-1">
            <button onclick="insertText('note-editor', '**Bold**')" class="px-2 py-1 bg-[#1e2740] rounded text-xs font-bold">B</button>
            <button onclick="insertText('note-editor', '*Italic*')" class="px-2 py-1 bg-[#1e2740] rounded text-xs italic">I</button>
            <button onclick="insertText('note-editor', '## Header\n')" class="px-2 py-1 bg-[#1e2740] rounded text-xs">H2</button>
            <button onclick="insertText('note-editor', '- List Item\n')" class="px-2 py-1 bg-[#1e2740] rounded text-xs">List</button>
            <button onclick="insertText('note-editor', '> Quote\n')" class="px-2 py-1 bg-[#1e2740] rounded text-xs">Quote</button>
            <button onclick="insertText('note-editor', '\\\\( x^2 \\\\)')" class="px-2 py-1 bg-[#1e2740] rounded text-xs">Math</button>
          </div>
        </div>
        <textarea id="note-editor" class="input-dark code-editor flex-grow min-h-[300px]" placeholder="Type notes here... Markdown (e.g. # Header, **bold**) and MathJax \\( x^2 \\) are supported." oninput="saveDraft()"></textarea>
      </div>

      <!-- TAB 2: SVG STUDIO -->
      <div id="pane-svg" class="tab-pane h-full flex flex-col space-y-4">
        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="text-xs font-bold text-[#8598AC] uppercase">Attached SVGs</label>
            <button onclick="createNewSVG()" class="px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-bold active:scale-95"><i class="fas fa-plus"></i> New SVG</button>
          </div>
          <div id="svg-list-container" class="flex gap-2 overflow-x-auto pb-2"></div>
        </div>

        <div id="svg-editor-area" class="hidden flex-col flex-grow space-y-3">
          <div class="bg-[#101830] border border-[#1e2740] rounded-xl p-3">
            <h3 class="text-sm font-bold text-[#E7EEF6] mb-2"><i class="fas fa-magic text-[#f59e0b] mr-1"></i> Template Generator</h3>
            <div class="grid grid-cols-2 gap-2 mb-2">
              <input type="text" id="svg-title" class="input-dark" placeholder="Title">
              <input type="text" id="svg-filename" class="input-dark" placeholder="Filename (e.g. pv.svg)" oninput="updateActiveSVGFilename()">
            </div>
            <div class="flex gap-2">
              <select id="svg-type" class="input-dark flex-grow">
                <option value="pvd">PV Diagram</option>
                <option value="tree">Tree</option>
                <option value="matrix">Matrix</option>
                <option value="timeline">Timeline</option>
              </select>
              <button onclick="generateSVG()" class="bg-[#4f46e5] text-white px-4 py-2 rounded-lg text-xs font-bold">Generate</button>
            </div>
          </div>
          <div class="flex-grow flex flex-col">
            <div class="flex justify-between items-center mb-1">
              <label class="text-xs font-bold text-[#8598AC] uppercase">Raw SVG Code</label>
              <button onclick="deleteActiveSVG()" class="text-rose-500 text-xs font-bold hover:underline">Delete this SVG</button>
            </div>
            <textarea id="svg-editor" class="input-dark code-editor flex-grow min-h-[150px]" placeholder="<svg>...</svg>" oninput="saveDraft()"></textarea>
          </div>
        </div>
      </div>

      <!-- TAB 3: PREVIEW -->
      <div id="pane-preview" class="tab-pane h-full">
        <div class="bg-[#0B1020] border border-[#1e2740] rounded-xl p-5 shadow-lg">
          <h2 class="font-bold text-lg mb-4 text-white" id="preview-topic-title">Topic</h2>
          <div id="preview-notes-content" class="preview-content"></div>
          <div id="preview-svg-container" class="mt-6 border-t border-[#1e2740] pt-4">
            <h4 class="text-xs font-bold text-[#8598AC] uppercase mb-3">Attached Images (Tap to zoom)</h4>
            <div id="preview-svg-gallery" class="grid grid-cols-2 gap-3"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- STICKY BOTTOM BAR -->
  <div class="fixed bottom-0 left-0 w-full bg-[#0B1020] border-t border-[#1e2740] p-3 flex gap-3 z-20">
    <button onclick="loadFromGitHub()" class="flex-1 bg-[#101830] border border-[#1e2740] text-[#E7EEF6] py-3 rounded-xl text-sm font-bold flex items-center justify-center gap-2">
      <i class="fas fa-download"></i> Load
    </button>
    <button onclick="publishToGitHub()" class="flex-[2] bg-amber-500 text-black py-3 rounded-xl text-sm font-extrabold flex items-center justify-center gap-2">
      <i class="fab fa-github"></i> Publish Subject
    </button>
  </div>

  <!-- SIDEBAR -->
  <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-40" onclick="toggleSidebar()"></div>
  <aside id="sidebar" class="fixed top-0 left-0 w-[280px] h-full bg-[#0a0f1d] border-r border-[#1e2740] z-50 flex flex-col">
    <div class="p-4 border-b border-[#1e2740] flex justify-between items-center bg-[#0B1020]">
      <h2 class="font-extrabold text-sm">Library</h2>
      <button onclick="toggleSidebar()" class="w-8 h-8 rounded-lg bg-[#1e2740] flex items-center justify-center"><i class="fas fa-times"></i></button>
    </div>
    <div class="p-3 border-b border-[#1e2740] flex gap-2">
      <button onclick="addNewSubject()" class="flex-1 bg-emerald-600 text-white py-2 rounded-lg text-xs font-bold"><i class="fas fa-plus"></i> Subject</button>
      <button onclick="addNewTopic()" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg text-xs font-bold"><i class="fas fa-plus"></i> Topic</button>
    </div>
    <div class="flex-grow overflow-y-auto p-3 space-y-2" id="sidebar-tree"></div>
  </aside>

  <!-- MODALS -->
  <div id="github-modal" class="fixed inset-0 bg-black/80 z-[100] hidden flex items-center justify-center p-4">
    <div class="bg-[#0B1020] border border-[#1e2740] rounded-2xl w-full max-w-sm">
      <div class="p-4 border-b border-[#1e2740] flex justify-between items-center bg-[#0c1222]">
        <h3 class="font-bold text-sm"><i class="fab fa-github mr-1"></i> GitHub Settings</h3>
        <button onclick="closeModal('github-modal')" class="text-gray-400"><i class="fas fa-times"></i></button>
      </div>
      <div class="p-4 space-y-3">
        <div>
          <label class="text-[10px] font-bold text-[#8598AC] uppercase mb-1 block">Owner / Repo</label>
          <div class="flex gap-2">
            <input type="text" id="gh-owner" class="input-dark !w-1/2" placeholder="User">
            <input type="text" id="gh-repo" class="input-dark !w-1/2" placeholder="Repo">
          </div>
        </div>
        <div>
          <label class="text-[10px] font-bold text-[#8598AC] uppercase mb-1 block">Token</label>
          <input type="password" id="gh-token" class="input-dark" placeholder="ghp_...">
        </div>
        <button onclick="saveGithubSettings()" class="w-full bg-[#4f46e5] text-white py-2.5 rounded-lg text-sm font-bold mt-2">Save</button>
      </div>
    </div>
  </div>

  <div id="toast-layer" class="fixed top-16 right-4 z-[999] flex flex-col gap-2 items-end pointer-events-none"></div>

  <script>
    let state = {
      activeSubject: '',
      activeTopic: '',
      activeSvgIndex: -1,
      data: {}, 
      github: { owner: '', repo: '', token: '' }
    };

    const saved = localStorage.getItem('cbt_studio_v2');
    if (saved) {
      state = JSON.parse(saved);
    } else {
      state.data = { "Untitled Subject": { "Untitled Topic": { notes: "", svgs: [] } } };
      state.activeSubject = "Untitled Subject";
      state.activeTopic = "Untitled Topic";
    }

    function saveState() { localStorage.setItem('cbt_studio_v2', JSON.stringify(state)); }

    /* =========================================================
       NAVIGATION & SIDEBAR
       ========================================================= */
    function toggleSidebar() {
      const sb = document.getElementById('sidebar');
      const ov = document.getElementById('sidebar-overlay');
      if (sb.classList.contains('open')) {
        sb.classList.remove('open');
        ov.classList.remove('open');
      } else {
        sb.classList.add('open');
        ov.classList.add('open');
      }
    }

    function renderSidebar() {
      let html = '';
      for (const [subj, topics] of Object.entries(state.data)) {
        html += `<div class="mb-3"><h4 class="text-xs font-extrabold text-indigo-400 mb-1 flex justify-between items-center">
          <span><i class="fas fa-book mr-1"></i>${subj}</span>
          <button onclick="deleteSubject('${subj}')" class="text-gray-500 hover:text-rose-500 px-1"><i class="fas fa-trash text-[10px]"></i></button>
        </h4><div class="space-y-1 ml-2 border-l border-[#1e2740] pl-2">`;
        
        for (const topic of Object.keys(topics)) {
          const isActive = state.activeSubject === subj && state.activeTopic === topic;
          html += `<div class="flex items-center justify-between group">
            <button onclick="selectTopic('${subj}', '${topic}')" class="flex-grow text-left px-2 py-1.5 rounded-lg text-sm ${isActive ? 'bg-indigo-500/20 text-indigo-300 font-bold' : 'text-gray-400 hover:bg-[#101830]'}">${topic}</button>
            <button onclick="deleteTopic('${subj}', '${topic}')" class="text-gray-600 hover:text-rose-500 px-2 opacity-50 group-hover:opacity-100 transition-opacity"><i class="fas fa-times text-[10px]"></i></button>
          </div>`;
        }
        html += `</div></div>`;
      }
      document.getElementById('sidebar-tree').innerHTML = html;
    }

    function selectTopic(subj, topic) {
      state.activeSubject = subj; 
      state.activeTopic = topic;
      state.activeSvgIndex = -1;
      loadTopicIntoEditor(); 
      toggleSidebar(); 
      renderSidebar();
    }

    function addNewSubject() {
      const name = prompt("Enter new Subject name:");
      if (!name) return;
      if (state.data[name]) return toast('Subject already exists', 'error');
      state.data[name] = { "General": { notes: "", svgs: [] } };
      selectTopic(name, "General");
      saveState();
    }

    function addNewTopic() {
      if (!state.activeSubject) return toast('Select a subject first', 'error');
      const name = prompt("Enter new Topic name for " + state.activeSubject + ":");
      if (!name) return;
      if (state.data[state.activeSubject][name]) return toast('Topic already exists', 'error');
      state.data[state.activeSubject][name] = { notes: "", svgs: [] };
      selectTopic(state.activeSubject, name);
      saveState();
    }

    function deleteSubject(subj) {
      if (!confirm(`Delete subject "${subj}" and ALL its topics?`)) return;
      delete state.data[subj];
      const firstSubj = Object.keys(state.data)[0];
      if (firstSubj) selectTopic(firstSubj, Object.keys(state.data[firstSubj])[0]);
      else location.reload();
      saveState();
    }

    function deleteTopic(subj, topic) {
      if (!confirm(`Delete topic "${topic}"?`)) return;
      delete state.data[subj][topic];
      const firstTopic = Object.keys(state.data[subj])[0];
      if (firstTopic) selectTopic(subj, firstTopic);
      else selectTopic(subj, ""); 
      saveState();
    }

    /* =========================================================
       EDITOR LOGIC
       ========================================================= */
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      document.getElementById(`pane-${tab}`).classList.add('active');
      if (tab === 'preview') updatePreview();
    }

    function insertText(id, text) {
      const el = document.getElementById(id), start = el.selectionStart, end = el.selectionEnd;
      el.value = el.value.substring(0, start) + text + el.value.substring(end);
      el.focus(); el.selectionStart = el.selectionEnd = start + text.length; saveDraft();
    }

    function loadTopicIntoEditor() {
      if (!state.activeSubject || !state.activeTopic) {
        document.getElementById('current-subject-label').textContent = "No topic selected";
        return;
      }
      
      document.getElementById('current-subject-label').textContent = `${state.activeSubject} > ${state.activeTopic}`;
      document.getElementById('topic-name-input').value = state.activeTopic;
      
      const draft = state.data[state.activeSubject][state.activeTopic];
      document.getElementById('note-editor').value = draft.notes || '';
      
      renderSVGList();
      closeSVGEditor();
      updatePreview();
    }

    function updateTopicName(newName) {
      if (!newName.trim() || newName === state.activeTopic) return;
      const oldName = state.activeTopic;
      const draft = state.data[state.activeSubject][oldName];
      
      state.data[state.activeSubject][newName] = draft;
      delete state.data[state.activeSubject][oldName];
      
      state.activeTopic = newName;
      document.getElementById('current-subject-label').textContent = `${state.activeSubject} > ${state.activeTopic}`;
      renderSidebar();
      saveState();
    }

    function saveDraft() {
      if (!state.activeSubject || !state.activeTopic) return;
      
      state.data[state.activeSubject][state.activeTopic].notes = document.getElementById('note-editor').value;
      
      if (state.activeSvgIndex > -1) {
        const svgs = state.data[state.activeSubject][state.activeTopic].svgs;
        svgs[state.activeSvgIndex].code = document.getElementById('svg-editor').value.trim();
      }
      
      saveState();
      updatePreview();
    }

    /* =========================================================
       SVG MANAGEMENT
       ========================================================= */
    function renderSVGList() {
      if (!state.activeSubject || !state.activeTopic) return;
      const container = document.getElementById('svg-list-container');
      const svgs = state.data[state.activeSubject][state.activeTopic].svgs || [];
      
      if (svgs.length === 0) {
        container.innerHTML = '<p class="text-xs text-gray-500 italic py-2">No SVGs yet. Click "New SVG" to add one.</p>';
        return;
      }

      container.innerHTML = svgs.map((svg, i) => {
        const isActive = state.activeSvgIndex === i;
        
        let previewUrl = '';
        if (svg.code && svg.code.trim().startsWith('<svg')) {
          const blob = new Blob([svg.code], {type: 'image/svg+xml'});
          previewUrl = URL.createObjectURL(blob);
        } else {
          previewUrl = `https://raw.githubusercontent.com/${state.github.owner}/${state.github.repo}/main/question-banks/${getSlug(state.activeSubject)}/${svg.filename}`;
        }

        return `<button onclick="selectSVG(${i})" class="svg-item-btn flex-none w-20 h-16 rounded-lg border border-[#1e2740] bg-[#101830] p-1 overflow-hidden flex flex-col items-center justify-center ${isActive ? 'active' : ''}">
          <img src="${previewUrl}" class="w-full h-8 object-contain mb-1" onerror="this.src='data:image/svg+xml;charset=utf-8,%3Csvg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'100\\' height=\\'100\\'%3E%3Crect width=\\'100\\' height=\\'100\\' fill=\\'%231e2740\\'/%3E%3Ctext x=\\'50\\' y=\\'50\\' fill=\\'%238598AC\\' font-size=\\'12\\' text-anchor=\\'middle\\' dy=\\'.3em\\'%3ENo Code%3C/text%3E%3C/svg%3E'">
          <span class="text-[8px] truncate w-full text-center text-gray-400">${svg.filename || 'image.svg'}</span>
        </button>`;
      }).join('');
    }

    function createNewSVG() {
      if (!state.activeSubject || !state.activeTopic) return toast('Select a topic first', 'error');
      const svgs = state.data[state.activeSubject][state.activeTopic].svgs;
      const newIndex = svgs.length;
      svgs.push({ filename: `image-${newIndex + 1}.svg`, code: '' });
      selectSVG(newIndex);
    }

    function selectSVG(index) {
      state.activeSvgIndex = index;
      const svg = state.data[state.activeSubject][state.activeTopic].svgs[index];
      
      document.getElementById('svg-editor-area').classList.remove('hidden');
      document.getElementById('svg-editor-area').classList.add('flex');
      document.getElementById('svg-editor').value = svg.code || '';
      document.getElementById('svg-filename').value = svg.filename || '';
      
      renderSVGList();
    }

    function closeSVGEditor() {
      state.activeSvgIndex = -1;
      document.getElementById('svg-editor-area').classList.add('hidden');
      document.getElementById('svg-editor-area').classList.remove('flex');
      renderSVGList();
    }

    function deleteActiveSVG() {
      if (state.activeSvgIndex === -1) return;
      if (!confirm('Delete this SVG?')) return;
      
      const svgs = state.data[state.activeSubject][state.activeTopic].svgs;
      svgs.splice(state.activeSvgIndex, 1);
      closeSVGEditor();
      saveState();
    }

    function updateActiveSVGFilename() {
      if (state.activeSvgIndex === -1) return;
      const val = document.getElementById('svg-filename').value;
      state.data[state.activeSubject][state.activeTopic].svgs[state.activeSvgIndex].filename = val;
      saveState();
      renderSVGList();
    }

    function generateSVG() {
      if (state.activeSvgIndex === -1) return toast('Click "New SVG" first', 'error');
      
      const title = document.getElementById('svg-title').value || 'Title';
      const type = document.getElementById('svg-type').value;
      
      let shapes = '';
      if (type === 'pvd') shapes = '<path d="M90 300 C 180 140, 260 120, 330 90" stroke="#2DD4BF" stroke-width="4" fill="none"/><path d="M90 300 C 170 240, 250 210, 340 200" stroke="#7c3aed" stroke-width="3" stroke-dasharray="7 6" fill="none"/>';
      else if (type === 'tree') shapes = '<g stroke="#64748b" stroke-width="2"><line x1="200" y1="90" x2="120" y2="170"/><line x1="200" y1="90" x2="280" y2="170"/><line x1="120" y1="170" x2="80" y2="250"/><line x1="120" y1="170" x2="160" y2="250"/><line x1="280" y1="170" x2="240" y2="250"/><line x1="280" y1="170" x2="320" y2="250"/></g><circle cx="200" cy="90" r="16" fill="#2DD4BF"/><circle cx="120" cy="170" r="12" fill="#0d9488"/><circle cx="280" cy="170" r="12" fill="#0d9488"/>';
      else if (type === 'matrix') shapes = '<g stroke="#334155" stroke-width="1"><line x1="80" y1="120" x2="340" y2="120"/><line x1="80" y1="180" x2="340" y2="180"/><line x1="80" y1="240" x2="340" y2="240"/><line x1="120" y1="80" x2="120" y2="290"/><line x1="180" y1="80" x2="180" y2="290"/><line x1="240" y1="80" x2="240" y2="290"/><line x1="300" y1="80" x2="300" y2="290"/></g><polygon points="180,120 300,120 240,240 120,240" fill="#2DD4BF" opacity=".35" stroke="#2DD4BF" stroke-width="3"/>';
      else shapes = '<line x1="70" y1="210" x2="340" y2="210" stroke="#475569" stroke-width="3"/><circle cx="110" cy="210" r="8" fill="#2DD4BF"/><circle cx="190" cy="210" r="8" fill="#14b8a6"/><circle cx="270" cy="210" r="8" fill="#a78bfa"/><circle cx="330" cy="210" r="8" fill="#f59e0b"/>';

      document.getElementById('svg-editor').value = `<svg xmlns="http://www.w3.org/2000/svg" width="420" height="320" viewBox="0 0 420 320">\n  <rect width="420" height="320" rx="16" fill="#0B1020"/>\n  <rect x="1" y="1" width="418" height="318" rx="16" fill="none" stroke="#22304F"/>\n  <text x="28" y="44" fill="#EAF2F6" font-family="sans-serif" font-size="18" font-weight="700">${title}</text>\n  ${shapes}\n</svg>`;
      
      saveDraft(); 
      switchTab('preview'); 
      toast('SVG Generated!', 'success');
    }

    /* =========================================================
       PREVIEW & FULLSCREEN IMAGE
       ========================================================= */
    // HELPER: Protect LaTeX from Markdown parser
    function parseMarkdownWithMath(rawText) {
      if (!rawText) return '';
      if (!window.marked) return rawText;

      const mathBlocks = [];
      let text = rawText;

      // Hide Display Math \[ ... \]
      text = text.replace(/\\\[([\s\S]*?)\\\]/g, function(match) {
        mathBlocks.push(match);
        return `@@MATHBLOCK${mathBlocks.length - 1}@@`;
      });
      
      // Hide Display Math $$ ... $$
      text = text.replace(/\$\$([\s\S]*?)\$\$/g, function(match) {
        mathBlocks.push(match);
        return `@@MATHBLOCK${mathBlocks.length - 1}@@`;
      });

      // Hide Inline Math \( ... \)
      text = text.replace(/\\\((.*?)\\\)/g, function(match) {
        mathBlocks.push(match);
        return `@@MATHBLOCK${mathBlocks.length - 1}@@`;
      });

      // Parse Markdown
      let html = window.marked.parse(text);

      // Restore Math Blocks
      html = html.replace(/@@MATHBLOCK(\d+)@@/g, function(match, index) {
        return mathBlocks[index];
      });

      return html;
    }

    function updatePreview() {
      if (!state.activeSubject || !state.activeTopic) return;
      const draft = state.data[state.activeSubject][state.activeTopic];
      
      document.getElementById('preview-topic-title').textContent = state.activeTopic;
      
      const rawMarkdown = draft.notes || '';
      const htmlContent = parseMarkdownWithMath(rawMarkdown);
      
      document.getElementById('preview-notes-content').innerHTML = htmlContent || '<p class="text-gray-500 italic">No notes yet...</p>';
      
      const gallery = document.getElementById('preview-svg-gallery');
      if (draft.svgs && draft.svgs.length > 0) {
        gallery.innerHTML = draft.svgs.map(svg => {
          let imgUrl = '';
          if (svg.code && svg.code.trim().startsWith('<svg')) {
            const blob = new Blob([svg.code], {type: 'image/svg+xml'});
            imgUrl = URL.createObjectURL(blob);
          } else {
            imgUrl = `https://raw.githubusercontent.com/${state.github.owner}/${state.github.repo}/main/question-banks/${getSlug(state.activeSubject)}/${svg.filename}`;
          }

          return `<div onclick="viewImageFullscreen('${imgUrl}')" class="bg-[#101830] border border-[#1e2740] rounded-lg p-2 cursor-pointer transition-transform active:scale-95">
            <img src="${imgUrl}" class="w-full h-32 object-contain rounded" onerror="this.src='data:image/svg+xml;charset=utf-8,%3Csvg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'100\\' height=\\'100\\'%3E%3Crect width=\\'100\\' height=\\'100\\' fill=\\'%231e2740\\'/%3E%3Ctext x=\\'50\\' y=\\'50\\' fill=\\'%238598AC\\' font-size=\\'12\\' text-anchor=\\'middle\\' dy=\\'.3em\\'%3ENo Image%3C/text%3E%3C/svg%3E'">
          </div>`;
        }).join('');
      } else {
        gallery.innerHTML = '<p class="text-xs text-gray-500 italic">No images attached.</p>';
      }
      
      if (window.MathJax) MathJax.typesetPromise([document.getElementById('pane-preview')]).catch(()=>{});
    }

    function viewImageFullscreen(url) {
      const overlay = document.createElement('div');
      overlay.className = 'fixed inset-0 bg-black/90 z-[9999] flex items-center justify-center p-4 cursor-zoom-out animate-fadeIn';
      overlay.onclick = () => overlay.remove();
      overlay.innerHTML = `<img src="${url}" class="max-w-full max-h-[90vh] object-contain rounded-lg shadow-2xl bg-[#0B1020] border border-[#1e2740]">`;
      document.body.appendChild(overlay);
    }

    /* =========================================================
       GITHUB FETCH & PUBLISH
       ========================================================= */
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    function saveGithubSettings() {
      state.github.owner = document.getElementById('gh-owner').value.trim();
      state.github.repo = document.getElementById('gh-repo').value.trim();
      state.github.token = document.getElementById('gh-token').value.trim();
      saveState(); closeModal('github-modal'); toast('Settings saved', 'success');
    }

    function getSlug(str) { return str.toLowerCase().replace(/[^a-z0-9]+/g, '-'); }

    async function loadFromGitHub() {
      if (!state.github.owner || !state.github.repo) return toast('Set GitHub settings first', 'error');
      const subjSlug = getSlug(state.activeSubject);
      const path = `question-banks/${subjSlug}/notes.js`;
      toast('Fetching ' + path + '...', 'info');
      
      try {
        const url = `https://raw.githubusercontent.com/${state.github.owner}/${state.github.repo}/main/${path}`;
        const res = await fetch(url + '?t=' + Date.now());
        if (!res.ok) throw new Error('File not found on GitHub');
        const text = await res.text();

        const dummyWindow = { CBT_SUBJECT_NOTES: {}, CBT_SUBJECT_IMAGES: {} };
        new Function('window', text)(dummyWindow);
        
        const notesObj = dummyWindow.CBT_SUBJECT_NOTES[state.activeSubject] || {};
        const imagesObj = dummyWindow.CBT_SUBJECT_IMAGES[state.activeSubject] || {};

        state.data[state.activeSubject] = {}; 

        for (const [topic, noteContent] of Object.entries(notesObj)) {
          if (!state.data[state.activeSubject][topic]) state.data[state.activeSubject][topic] = { notes: "", svgs: [] };
          state.data[state.activeSubject][topic].notes = noteContent;
        }

        for (const [topic, imgArray] of Object.entries(imagesObj)) {
           if (!state.data[state.activeSubject][topic]) state.data[state.activeSubject][topic] = { notes: "", svgs: [] };
           
           state.data[state.activeSubject][topic].svgs = await Promise.all(imgArray.map(async img => {
             let svgCode = '';
             if (img.data && !img.data.startsWith('data:') && !img.data.startsWith('<svg')) {
               try {
                 const svgUrl = `https://raw.githubusercontent.com/${state.github.owner}/${state.github.repo}/main/${img.data}`;
                 const svgRes = await fetch(svgUrl);
                 if (svgRes.ok) svgCode = await svgRes.text();
               } catch (e) { console.warn('Could not fetch SVG file', e); }
             } else if (img.data.startsWith('<svg')) {
               svgCode = img.data; 
             }
             return { filename: img.filename, code: svgCode };
           }));
        }

        const firstTopic = Object.keys(state.data[state.activeSubject])[0];
        selectTopic(state.activeSubject, firstTopic || 'General');
        saveState(); 
        toast('Loaded from GitHub!', 'success');
      } catch (err) {
        toast('Fetch failed: ' + err.message, 'error');
      }
    }

    async function publishToGitHub() {
      if (!state.github.owner || !state.github.repo || !state.github.token) return toast('Set GitHub settings first', 'error');
      
      const subj = state.activeSubject;
      const subjSlug = getSlug(subj);
      toast('Publishing to GitHub...', 'info');
      
      let notesContent = `/* Auto-generated by Admin Studio */\nwindow.CBT_SUBJECT_NOTES = window.CBT_SUBJECT_NOTES || {};\nwindow.CBT_SUBJECT_NOTES['${subj}'] = {\n`;
      let imagesContent = `window.CBT_SUBJECT_IMAGES = window.CBT_SUBJECT_IMAGES || {};\nwindow.CBT_SUBJECT_IMAGES['${subj}'] = {\n`;

      for (const [topic, draft] of Object.entries(state.data[subj])) {
        if (draft.notes) notesContent += `  '${topic}': \`${draft.notes.replace(/`/g, '\\`')}\`,\n`;
        
        if (draft.svgs && draft.svgs.length > 0) {
          imagesContent += `  '${topic}': [\n`;
          for (const svg of draft.svgs) {
            imagesContent += `    { data: 'question-banks/${subjSlug}/${svg.filename}', filename: '${svg.filename}' },\n`;
            
            if (svg.code && svg.code.trim().length > 0) {
               await fetch('/api/publish-bank', {
                  method: 'POST', headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ filename: `${subjSlug}/${svg.filename}`, code: svg.code, githubToken: state.github.token, repoOwner: state.github.owner, repoName: state.github.repo })
               });
            }
          }
          imagesContent += `  ],\n`;
        }
      }
      
      notesContent += `};\n\n`;
      imagesContent += `};\n`;
      const finalCode = notesContent + imagesContent;

      try {
        const res = await fetch('/api/publish-bank', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: `${subjSlug}/notes.js`, code: finalCode, githubToken: state.github.token, repoOwner: state.github.owner, repoName: state.github.repo })
        });
        
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || 'Publish failed');
        
        toast('Subject published successfully!', 'success');
      } catch (err) {
        toast('Publish failed: ' + err.message, 'error');
      }
    }

    function toast(msg, type) {
      const el = document.createElement('div');
      el.className = `text-white text-xs font-bold px-4 py-3 rounded-xl shadow-2xl mb-2 ${type==='error'?'bg-rose-600':(type==='success'?'bg-emerald-600':'bg-indigo-600')}`;
      el.textContent = msg;
      document.getElementById('toast-layer').appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3000);
    }

    window.onload = () => {
      document.getElementById('gh-owner').value = state.github.owner || '';
      document.getElementById('gh-repo').value = state.github.repo || '';
      document.getElementById('gh-token').value = state.github.token || '';
      
      const firstSubj = Object.keys(state.data)[0];
      if (firstSubj) {
        state.activeSubject = firstSubj;
        state.activeTopic = Object.keys(state.data[firstSubj])[0];
        loadTopicIntoEditor();
      }
      renderSidebar();
    };
  </script>
