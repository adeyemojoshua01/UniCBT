<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>eduCBT — Admin Studio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
  options: { ignoreHtmlClass: 'no-mathjax' },
  chtml: { displayOverflow: 'linebreak', linebreaks: { inline: true } }   // long equations wrap inside the box
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-chtml.js"></script>
<style>
  :root { --bg-dark: #05070D; --panel-dark: #0B1020; --border-dark: #1e2740; --text-main: #E7EEF6; --text-muted: #8598AC; --accent: #f59e0b; }
  body { background-color: var(--bg-dark); color: var(--text-main); font-family: ui-sans-serif, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border-dark); border-radius: 4px; }
  
  .input-dark { background-color: #101830; border: 1px solid var(--border-dark); color: var(--text-main); border-radius: 10px; padding: 12px 14px; width: 100%; font-size: 14px; transition: border-color 0.2s; }
  .input-dark:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15); }
  .code-editor { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; line-height: 1.6; resize: vertical; background-color: #020408; }
  
  .tab-btn { flex: 1; padding: 14px 0; font-size: 13px; font-weight: 700; color: var(--text-muted); border-bottom: 2px solid transparent; transition: all 0.2s; }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-pane { display: none; }
  .tab-pane.active { display: flex; flex-direction: column; animation: fadeIn 0.3s ease; flex-grow: 1; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  
  .preview-content { font-size: 15px; line-height: 1.6; color: #cbd5e1; min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
  #pane-notes .grid > * { min-width: 0; }
  mjx-container[display="true"] { display: block !important; max-width: 100% !important; overflow-x: auto !important; overflow-y: hidden; }
  .preview-content h1, .preview-content h2, .preview-content h3 { font-weight: 800; margin: 1.2em 0 0.5em; color: #fff; line-height: 1.3; }
  .preview-content h1 { font-size: 1.5em; border-bottom: 1px solid var(--border-dark); padding-bottom: 5px; }
  .preview-content h2 { font-size: 1.3em; }
  .preview-content p { margin-bottom: 1em; }
  .preview-content ul { list-style-type: disc; margin: 1em 0 1em 1.5em; }
  .preview-content ol { list-style-type: decimal; margin: 1em 0 1em 1.5em; }
  .preview-content blockquote { border-left: 4px solid var(--accent); padding: 10px 14px; margin: 1em 0; font-style: italic; background: rgba(245,158,11,0.05); border-radius: 0 8px 8px 0; }
  .preview-content table { width: 100%; border-collapse: collapse; margin: 1em 0; font-size: 14px; }
  .preview-content th, .preview-content td { border: 1px solid var(--border-dark); padding: 8px 12px; text-align: left; }
  .preview-content th { background: #101830; color: #fff; font-weight: 700; }
  .preview-content hr { border: 0; border-top: 1px solid var(--border-dark); margin: 1.5em 0; }
  .preview-content strong { color: #fff; font-weight: 700; }
  
  #sidebar { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(-100%); box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
  #sidebar.open { transform: translateX(0); }
  #sidebar-overlay { transition: opacity 0.3s ease; opacity: 0; pointer-events: none; }
  #sidebar-overlay.open { opacity: 1; pointer-events: auto; }
  
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  
  .tree-spine { border-left: 1px solid var(--border-dark); margin-left: 10px; padding-left: 10px; }
  .folder-icon { transition: transform 0.2s; }
  details[open] > summary .folder-icon { transform: rotate(90deg); }

  .svg-item-btn { transition: all 0.2s; }
  .svg-item-btn.active { border-color: var(--accent); background: rgba(245,158,11,0.1); }
  
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden">

  <header class="flex-none bg-[#0B1020] border-b border-[#1e2740] px-4 py-3 flex items-center justify-between z-20">
    <div class="flex items-center gap-3">
      <button onclick="toggleSidebar()" class="w-10 h-10 rounded-xl bg-[#101830] border border-[#1e2740] flex items-center justify-center text-gray-300 active:scale-95 transition-transform"><i class="fas fa-bars"></i></button>
      <div>
        <h1 class="font-extrabold text-sm leading-tight flex items-center gap-1.5"><i class="fas fa-code text-amber-500"></i> Admin Studio</h1>
        <p id="current-path-label" class="text-[11px] text-[#8598AC] leading-tight truncate max-w-[160px]">Select a file...</p>
      </div>
    </div>
    <span id="save-status" class="text-[11px] font-bold px-2.5 py-1 rounded-full border border-[#1e2740] bg-[#101830] text-[#8598AC] whitespace-nowrap">No topic open</span>
    <button onclick="openModal('github-modal')" class="w-10 h-10 rounded-xl bg-[#101830] border border-[#1e2740] flex items-center justify-center text-gray-300 active:scale-95 transition-transform"><i class="fab fa-github text-lg"></i></button>
  </header>

  <main class="flex-grow flex flex-col overflow-hidden relative">
    <div class="flex-none flex border-b border-[#1e2740] bg-[#0B1020] z-10">
      <button onclick="switchTab('notes')" id="tab-notes" class="tab-btn active"><i class="fas fa-file-lines mr-1.5"></i> Notes</button>
      <button onclick="switchTab('svg')" id="tab-svg" class="tab-btn"><i class="fas fa-image mr-1.5"></i> SVGs</button>
      <button onclick="switchTab('preview')" id="tab-preview" class="tab-btn"><i class="fas fa-eye mr-1.5"></i> Preview</button>
    </div>

    <div class="flex-grow overflow-y-auto p-4 pb-24">
      <div id="pane-notes" class="tab-pane active">
        <div class="mb-3 grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-bold text-[#8598AC] uppercase">Subject Name</label>
            <input type="text" id="subject-name-input" class="input-dark mt-1 font-bold" oninput="updateSubjectName(this.value)">
          </div>
          <div>
            <label class="text-xs font-bold text-[#8598AC] uppercase">Topic Name</label>
            <input type="text" id="topic-name-input" class="input-dark mt-1 font-bold" oninput="updateTopicName(this.value)">
          </div>
        </div>
        <div class="mb-2 flex items-center justify-between flex-wrap gap-2">
          <label class="text-xs font-bold text-[#8598AC] uppercase">Markdown & LaTeX Editor</label>
          <div class="flex flex-wrap gap-1 items-center">
            <button onclick="wrapSel('**','**','bold')" class="px-2 py-1 bg-[#1e2740] hover:bg-[#2a3a5e] rounded text-xs font-bold" title="Bold (wraps selection)">B</button>
            <button onclick="wrapSel('*','*','italic')" class="px-2 py-1 bg-[#1e2740] hover:bg-[#2a3a5e] rounded text-xs italic" title="Italic (wraps selection)">I</button>
            <button onclick="insertText('note-editor', '## Header\n')" class="px-2 py-1 bg-[#1e2740] hover:bg-[#2a3a5e] rounded text-xs">H2</button>
            <button onclick="insertText('note-editor', '- List Item\n')" class="px-2 py-1 bg-[#1e2740] hover:bg-[#2a3a5e] rounded text-xs">List</button>
            <button onclick="insertText('note-editor', '> Quote\n')" class="px-2 py-1 bg-[#1e2740] hover:bg-[#2a3a5e] rounded text-xs">Quote</button>
            <button onclick="insertTable()" class="px-2 py-1 bg-[#1e2740] hover:bg-[#2a3a5e] rounded text-xs" title="Insert a table"><i class="fas fa-table mr-1"></i>Table</button>
            <button onclick="insertImageUrl()" class="px-2 py-1 bg-[#1e2740] hover:bg-[#2a3a5e] rounded text-xs" title="Insert an image from a link"><i class="fas fa-image mr-1"></i>Image</button>
            <button onclick="insertLink()" class="px-2 py-1 bg-[#1e2740] hover:bg-[#2a3a5e] rounded text-xs" title="Insert a link"><i class="fas fa-link mr-1"></i>Link</button>
            <select onchange="insertCallout(this)" class="px-2 py-1 bg-[#1e2740] rounded text-xs text-amber-300 border-0 cursor-pointer" title="Callout box">
              <option value="">Callout&hellip;</option>
              <option value="tip">&#128161; Tip</option>
              <option value="note">&#128204; Note</option>
              <option value="warn">&#9888;&#65039; Warning</option>
              <option value="key">&#128273; Key idea</option>
              <option value="ex">&#9999;&#65039; Example</option>
            </select>
            <select onchange="insertFormula(this)" class="px-2 py-1 bg-[#1e2740] rounded text-xs text-amber-400 border-0 cursor-pointer" title="Formula helper">
              <option value="">Formula&hellip;</option>
              <option value="frac">Fraction</option>
              <option value="sqrt">Square root</option>
              <option value="pow">Power x&sup2;</option>
              <option value="sub">Subscript x&#8321;</option>
              <option value="sum">Summation</option>
              <option value="int">Integral</option>
              <option value="lim">Limit</option>
              <option value="greek">Greek letters</option>
              <option value="vec">Vector</option>
              <option value="ce">Chemical formula</option>
              <option value="display">Display equation (own line)</option>
              <option value="inline">Inline math</option>
            </select>
            <button onclick="insertVideoLink()" class="px-2 py-1 bg-[#1e2740] hover:bg-[#2a3a5e] rounded text-xs text-rose-400" title="Insert a YouTube / Vimeo / mp4 link"><i class="fab fa-youtube mr-1"></i>Video / Playlist</button>
            <button onclick="syncPlaylists()" class="px-2 py-1 bg-[#1e2740] hover:bg-[#2a3a5e] rounded text-xs text-rose-300" title="Refresh the video list of every playlist in this note"><i class="fas fa-rotate mr-1"></i>Sync playlists</button>
          </div>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 flex-grow">
        <textarea id="note-editor" class="input-dark code-editor min-h-[400px] lg:min-h-[62vh]" placeholder="Select a topic from the sidebar to start writing..." oninput="saveDraft()"></textarea>
        <div class="hidden lg:flex flex-col bg-[#0B1020] border border-[#1e2740] rounded-xl overflow-hidden lg:max-h-[70vh]">
          <div class="px-4 py-2 border-b border-[#1e2740] text-xs font-bold text-[#8598AC] uppercase flex items-center gap-2"><i class="fas fa-eye"></i> Live preview <span class="ml-auto normal-case font-normal opacity-70">videos play in the Preview tab</span></div>
          <div id="split-preview" class="preview-content p-5 overflow-y-auto flex-grow"></div>
        </div>
        </div>
      </div>

      <div id="pane-svg" class="tab-pane">
        <div class="mb-4">
          <div class="flex items-center justify-between mb-2">
            <label class="text-xs font-bold text-[#8598AC] uppercase">Attached SVGs</label>
            <button onclick="createNewSVG()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold active:scale-95 transition-transform"><i class="fas fa-plus"></i> New SVG</button>
          </div>
          <div id="svg-list-container" class="flex gap-2 overflow-x-auto pb-2 min-h-[80px]"></div>
        </div>

        <div id="svg-editor-area" class="hidden flex-col space-y-4">
          <div class="bg-[#101830] border border-[#1e2740] rounded-xl p-4">
            <h3 class="text-sm font-bold text-[#E7EEF6] mb-3"><i class="fas fa-magic text-[#f59e0b] mr-1"></i> Template Generator</h3>
            <div class="grid grid-cols-2 gap-3 mb-3">
              <input type="text" id="svg-title" class="input-dark" placeholder="Title (e.g. PV Diagram)">
              <input type="text" id="svg-filename" class="input-dark" placeholder="Filename (e.g. pv.svg)" oninput="updateActiveSVGFilename()">
            </div>
            <div class="flex gap-2">
              <select id="svg-type" class="input-dark flex-grow">
                <option value="pvd">PV Diagram</option>
                <option value="tree">Tree</option>
                <option value="matrix">Matrix</option>
                <option value="timeline">Timeline</option>
              </select>
              <button onclick="generateSVG()" class="bg-[#4f46e5] hover:bg-[#4338ca] text-white px-4 py-2 rounded-lg text-xs font-bold transition-colors">Generate</button>
            </div>
          </div>
          <div class="flex-grow flex flex-col">
            <div class="flex justify-between items-center mb-2">
              <label class="text-xs font-bold text-[#8598AC] uppercase">Raw SVG Code</label>
              <button onclick="insertSvgRef()" class="text-indigo-400 hover:text-indigo-300 text-xs font-bold transition-colors mr-3"><i class="fas fa-link mr-1"></i> Insert into note</button>
              <button onclick="deleteActiveSVG()" class="text-rose-500 hover:text-rose-400 text-xs font-bold transition-colors"><i class="fas fa-trash mr-1"></i> Delete</button>
            </div>
            <textarea id="svg-editor" class="input-dark code-editor min-h-[250px]" placeholder="<svg>...</svg>" oninput="saveDraft()"></textarea>
          </div>
        </div>
      </div>

      <div id="pane-preview" class="tab-pane">
        <div class="bg-[#0B1020] border border-[#1e2740] rounded-xl p-5 shadow-lg mb-6">
          <div class="flex items-center gap-2 mb-4 border-b border-[#1e2740] pb-3">
            <div class="w-8 h-8 rounded-lg bg-[#4f46e5] text-white flex items-center justify-center"><i class="fas fa-eye text-xs"></i></div>
            <h2 class="font-bold text-sm">Live Preview</h2>
          </div>
          <h2 class="font-bold text-xl mb-4 text-white" id="preview-topic-title">Topic</h2>
          <div id="preview-notes-content" class="preview-content"></div>
          
          <div id="preview-video-container" class="mt-8 border-t border-[#1e2740] pt-5">
            <h4 class="text-xs font-bold text-[#8598AC] uppercase mb-3"><i class="fas fa-circle-play mr-1"></i> Videos in this note</h4>
            <div id="preview-video-gallery"></div>
          </div>

          <div id="preview-svg-container" class="mt-8 border-t border-[#1e2740] pt-5">
            <h4 class="text-xs font-bold text-[#8598AC] uppercase mb-3"><i class="fas fa-images mr-1"></i> Attached Images (Tap to zoom)</h4>
            <div id="preview-svg-gallery" class="grid grid-cols-2 md:grid-cols-3 gap-3"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="fixed bottom-0 left-0 w-full bg-[#0B1020] border-t border-[#1e2740] p-3 flex gap-3 z-20 shadow-[0_-10px_20px_rgba(0,0,0,0.3)]">
    <button onclick="loadFileFromPath(state.activePath)" id="btn-load" class="flex-1 bg-[#101830] border border-[#1e2740] text-[#E7EEF6] py-3 rounded-xl text-sm font-bold flex items-center justify-center gap-2 active:scale-95 transition-transform" disabled>
      <i class="fas fa-download"></i> Refresh
    </button>
    <button onclick="publishToGitHub()" id="btn-publish" class="flex-[2] bg-amber-500 hover:bg-amber-400 text-black py-3 rounded-xl text-sm font-extrabold flex items-center justify-center gap-2 active:scale-95 transition-transform shadow-lg shadow-amber-500/20" disabled>
      <i class="fab fa-github"></i> Publish Topic
    </button>
  </div>

  <div id="sidebar-overlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40" onclick="toggleSidebar()"></div>
  <aside id="sidebar" class="fixed top-0 left-0 w-[300px] h-full bg-[#0a0f1d] border-r border-[#1e2740] z-50 flex flex-col">
    <div class="p-4 border-b border-[#1e2740] flex justify-between items-center bg-[#0B1020]">
      <h2 class="font-extrabold text-sm"><i class="fas fa-folder-tree text-amber-500 mr-1"></i> GitHub Repo</h2>
      <button onclick="toggleSidebar()" class="w-8 h-8 rounded-lg bg-[#1e2740] hover:bg-[#2a3a5e] flex items-center justify-center transition-colors"><i class="fas fa-times"></i></button>
    </div>
    <div class="p-3 border-b border-[#1e2740] flex flex-col gap-2">
      <button onclick="fetchGitHubTree(true)" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-lg text-xs font-bold transition-colors flex items-center justify-center gap-2">
        <i class="fas fa-sync-alt"></i> Refresh Tree
      </button>
      <div class="grid grid-cols-2 gap-2 mt-1">
        <button onclick="createNewFolder()" class="bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-lg text-xs font-bold transition-colors flex items-center justify-center gap-1.5">
          <i class="fas fa-folder-plus"></i> Folder
        </button>
        <button onclick="createNewFile()" class="bg-sky-600 hover:bg-sky-500 text-white py-2 rounded-lg text-xs font-bold transition-colors flex items-center justify-center gap-1.5">
          <i class="fas fa-file-circle-plus"></i> File
        </button>
      </div>
    </div>
    <div class="flex-grow overflow-y-auto p-3 space-y-1 text-sm text-gray-300" id="sidebar-tree">
      <div class="text-center text-xs text-gray-500 mt-4">Connect GitHub to view files.</div>
    </div>
  </aside>

  <div id="github-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] hidden overflow-y-auto p-4 md:p-8">
    <div class="bg-[#0B1020] border border-[#1e2740] rounded-2xl w-full max-w-sm mx-auto shadow-2xl mt-10 md:mt-20 overflow-hidden">
      <div class="p-4 border-b border-[#1e2740] flex justify-between items-center bg-[#0c1222]">
        <h3 class="font-bold text-sm"><i class="fab fa-github mr-1"></i> GitHub Configuration</h3>
        <button type="button" onclick="closeModal('github-modal')" class="text-gray-400 hover:text-white"><i class="fas fa-times"></i></button>
      </div>
      
      <form id="github-form" onsubmit="event.preventDefault(); saveGithubSettings();" class="p-5 space-y-4">
        <div>
          <label class="text-[10px] font-bold text-[#8598AC] uppercase mb-1 block">Owner / Repo</label>
          <div class="flex gap-2">
            <input type="text" id="gh-owner" name="github_username" autocomplete="username" class="input-dark !w-1/2" placeholder="User">
            <input type="text" id="gh-repo" name="github_repo" class="input-dark !w-1/2" placeholder="Repo">
          </div>
        </div>
        <div>
          <label class="text-[10px] font-bold text-[#8598AC] uppercase mb-1 block">Personal Access Token</label>
          <input type="password" id="gh-token" name="github_token" autocomplete="current-password" class="input-dark" placeholder="ghp_...">
        </div>
        <button type="submit" class="w-full bg-[#4f46e5] hover:bg-[#4338ca] text-white py-3 rounded-xl text-sm font-bold mt-2 transition-colors shadow-lg">Save Settings</button>
      </form>
    </div>
  </div>

  <div id="toast-layer" class="fixed top-16 right-4 z-[999] flex flex-col gap-2 items-end pointer-events-none"></div>

  <script>
    let state = {
      activeSubject: '',
      activeTopic: '',
      activePath: '',
      originalPath: '', // Track original path to delete old file on rename
      activeSvgIndex: -1,
      data: {}, 
      github: { owner: '', repo: '', token: '' },
      treeData: null
    };

    const saved = localStorage.getItem('cbt_studio_codex');
    if (saved) {
      state = JSON.parse(saved);
      if (!state.github) state.github = { owner: '', repo: '', token: '' };
    } else {
      state.data = {}; 
    }

    function saveState() { localStorage.setItem('cbt_studio_codex', JSON.stringify(state)); }
    function getSlug(str) { return String(str || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); }

    function b64DecodeUnicode(str) {
        return decodeURIComponent(atob(str).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
    }

    async function fetchGitHubTree(force = false) {
      if (!state.github.owner || !state.github.repo || !state.github.token) {
        document.getElementById('sidebar-tree').innerHTML = '<div class="text-center text-xs text-red-400 mt-4">Set GitHub settings first.</div>';
        return;
      }

      const treeContainer = document.getElementById('sidebar-tree');
      treeContainer.innerHTML = '<div class="text-center text-xs text-gray-500 mt-4"><span class="spinner"></span> Fetching tree...</div>';

      try {
        const res = await fetch(`https://api.github.com/repos/${state.github.owner}/${state.github.repo}/git/trees/main?recursive=1`, {
          headers: { 
            'Authorization': `token ${state.github.token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });
        
        if (!res.ok) throw new Error('Failed to fetch tree. Check token permissions.');
        const data = await res.json();
        
        const root = {};
        data.tree.forEach(item => {
          if (!item.path.startsWith('question-banks/') || item.path === 'question-banks/') return;
          
          const parts = item.path.replace('question-banks/', '').split('/');
          let current = root;
          
          parts.forEach((part, i) => {
            if (!current[part]) {
              current[part] = (i === parts.length - 1 && item.type === 'blob') ? 'FILE' : {};
            }
            if (current[part] !== 'FILE') {
              current = current[part];
            }
          });
        });

        state.treeData = root;
        saveState();
        renderSidebarTree(root);
      } catch (err) {
        treeContainer.innerHTML = `<div class="text-center text-xs text-red-400 mt-4">${err.message}</div>`;
        toast(err.message, 'error');
      }
    }

    function renderSidebarTree(tree, container = document.getElementById('sidebar-tree'), parentPath = '') {
      if (!container) return;
      if (parentPath === '') container.innerHTML = '';

      if (Object.keys(tree).length === 0) {
        if (parentPath === '') container.innerHTML = '<div class="text-center text-xs text-gray-500 mt-4">No folders found.</div>';
        return;
      }

      const folders = Object.keys(tree).filter(k => tree[k] !== 'FILE').sort();
      const files = Object.keys(tree).filter(k => tree[k] === 'FILE').sort();

      folders.forEach(folder => {
        const fullPath = parentPath ? `${parentPath}/${folder}` : folder;
        
        const details = document.createElement('details');
        if (state.activePath.startsWith(fullPath)) details.open = true;
        details.className = 'mb-1';
        
        const summary = document.createElement('summary');
        summary.className = `flex items-center gap-2 px-2 py-1.5 rounded-lg cursor-pointer hover:bg-[#101830] transition-colors text-[13px] ${state.activePath.startsWith(fullPath) ? 'text-amber-400 font-bold' : 'text-gray-300'}`;
        summary.innerHTML = `<i class="fas fa-chevron-right folder-icon text-[10px] text-gray-500 w-3"></i> <i class="fas fa-folder text-amber-500/70 w-4 text-center"></i> <span class="truncate">${folder}</span>`;
        
        details.appendChild(summary);
        const childContainer = document.createElement('div');
        childContainer.className = 'tree-spine';
        details.appendChild(childContainer);
        
        renderSidebarTree(tree[folder], childContainer, fullPath);
        container.appendChild(details);
      });

      files.forEach(file => {
        const fullPath = parentPath ? `${parentPath}/${file}` : file;
        const isActive = state.activePath === fullPath;
        
        if (file.endsWith('.js')) {
          const btn = document.createElement('button');
          btn.className = `w-full text-left flex items-center gap-2 px-2 py-1.5 rounded-lg transition-colors text-[13px] ${isActive ? 'bg-amber-500/20 text-amber-400 font-bold' : 'text-gray-400 hover:bg-[#101830] hover:text-gray-200'}`;
          btn.innerHTML = `<span class="w-3"></span> <i class="fas fa-file-code w-4 text-center ${isActive ? 'text-amber-400' : 'text-gray-600'}"></i> <span class="truncate">${file}</span>`;
          btn.onclick = () => loadFileFromPath(fullPath);
          container.appendChild(btn);
        }
      });
    }

    async function loadFileFromPath(path) {
      if (isDirty && !confirm('You have unpublished changes in the open topic.\nLoading will discard them. Continue?')) return;
      if (!path) return toast('No file selected.', 'error');
      
      state.activePath = path;
      state.originalPath = path; // Save original path
      saveState();
      renderSidebarTree(state.treeData); 
      
      const parts = path.split('/');
      const filename = parts.pop();
      
      const subjectSlug = parts.length > 0 ? parts[0] : 'general';
      const topicSlug = filename.replace('.js', '');
      
      const formatName = (str) => str.charAt(0).toUpperCase() + str.slice(1).replace(/-/g, ' ');

      state.activeSubject = formatName(subjectSlug);
      state.activeTopic = formatName(topicSlug);
      
      document.getElementById('current-path-label').textContent = `question-banks / ${path}`;
      document.getElementById('subject-name-input').value = state.activeSubject;
      document.getElementById('topic-name-input').value = state.activeTopic;
      
      toast('Fetching ' + path + '...', 'info');
      try {
        const encodedPath = path.split('/').map(encodeURIComponent).join('/');
        const apiUrl = `https://api.github.com/repos/${state.github.owner}/${state.github.repo}/contents/question-banks/${encodedPath}?ref=main&t=${Date.now()}`;
        
        const res = await fetch(apiUrl, {
           headers: { 
             'Authorization': `token ${state.github.token}`,
             'Accept': 'application/vnd.github.v3+json'
           }
        });
        
        if (!res.ok) throw new Error('File not found on GitHub (Check token or path)');
        
        const fileData = await res.json();
        const text = b64DecodeUnicode(fileData.content.replace(/\n/g, ''));

        let noteContent = '';
        let imgArray = [];

        try {
          const dummyWindow = { CBT_SUBJECT_NOTES: {}, CBT_SUBJECT_IMAGES: {} };
          new Function('window', text)(dummyWindow);
          
          let notesObj = dummyWindow.CBT_SUBJECT_NOTES[state.activeSubject];
          
          if (!notesObj) {
              const availableSubjects = Object.keys(dummyWindow.CBT_SUBJECT_NOTES);
              if (availableSubjects.length > 0) {
                  notesObj = dummyWindow.CBT_SUBJECT_NOTES[availableSubjects[0]];
                  state.activeSubject = availableSubjects[0];
              } else {
                  notesObj = {};
              }
          }

          let actualNoteKey = Object.keys(notesObj).find(k => k.toLowerCase() === state.activeTopic.toLowerCase());
          
          if (actualNoteKey) {
              noteContent = notesObj[actualNoteKey];
          } else {
              const keys = Object.keys(notesObj);
              if (keys.length > 0) {
                  state.activeTopic = keys[0]; 
                  document.getElementById('topic-name-input').value = state.activeTopic;
                  noteContent = notesObj[keys[0]];
              }
          }

          let imagesObj = dummyWindow.CBT_SUBJECT_IMAGES[state.activeSubject] || {};
          let actualImgKey = Object.keys(imagesObj).find(k => k.toLowerCase() === state.activeTopic.toLowerCase());
          
          if (!actualImgKey && Object.keys(imagesObj).length > 0) {
              actualImgKey = Object.keys(imagesObj)[0];
          }
          imgArray = imagesObj[actualImgKey] || [];
          
        } catch (e) {
          console.warn('Could not parse file contents via execution, falling back to regex', e);
          const noteMatch = text.match(/window\.CBT_SUBJECT_NOTES\s*=\s*window\.CBT_SUBJECT_NOTES\s*\|\|\s*\{\};[\s\S]*?window\.CBT_SUBJECT_NOTES\['[^']+'\]\['[^']+'\]\s*=\s*`([\s\S]*?)`;/);
          if (noteMatch && noteMatch[1]) {
            noteContent = noteMatch[1].replace(/\\`/g, '`').replace(/\\\$\{/g, '${').replace(/\\\\/g, '\\');
          }
        }

        if (!state.data[state.activeSubject]) state.data[state.activeSubject] = {};
        state.data[state.activeSubject][state.activeTopic] = {
          notes: noteContent,
          svgs: await Promise.all(imgArray.map(async function(img) {
            let svgCode = '';
            const svgFilename = img.filename || img.data.split('/').pop();
            try {
              const svgPath = `question-banks/${subjectSlug}/svg/${svgFilename}`;
              const encodedSvgPath = svgPath.split('/').map(encodeURIComponent).join('/');
              const svgApiUrl = `https://api.github.com/repos/${state.github.owner}/${state.github.repo}/contents/${encodedSvgPath}?ref=main`;
              
              const svgRes = await fetch(svgApiUrl, { 
                headers: { 
                  'Authorization': `token ${state.github.token}`,
                  'Accept': 'application/vnd.github.v3+json'
                } 
              });
              if (svgRes.ok) {
                const svgData = await svgRes.json();
                svgCode = b64DecodeUnicode(svgData.content.replace(/\n/g, ''));
              }
            } catch (e) {
              console.warn('Could not fetch SVG content for', svgFilename);
            }
            return { filename: svgFilename, code: svgCode };
          }))
        };

        document.getElementById('btn-load').disabled = false;
        document.getElementById('btn-publish').disabled = false;

        loadTopicIntoEditor();
        saveState();
        toast('Loaded!', 'success');
        toggleSidebar();
      } catch (err) {
        toast('Fetch failed: ' + err.message, 'error');
      }
    }

    function loadTopicIntoEditor() {
      if (!state.activeSubject || !state.activeTopic) return;
      const draft = state.data[state.activeSubject][state.activeTopic];
      if (!draft) return;
      
      document.getElementById('note-editor').value = draft.notes || '';
      document.getElementById('subject-name-input').value = state.activeSubject;
      document.getElementById('topic-name-input').value = state.activeTopic;
      
      renderSVGList();
      closeSVGEditor();
      updatePreview();
      markDirty(false);
      renderSplitPreview();
    }

    function updateSubjectName(newName) {
  if (!newName.trim() || newName === state.activeSubject) return;
  const oldName = state.activeSubject;
  state.activeSubject = newName;
  
  // We ONLY change the display name inside the file. 
  // We DO NOT change state.activePath so the file stays in its original folder.
  
  if (state.data[oldName] && oldName !== newName) {
    state.data[newName] = state.data[oldName];
    delete state.data[oldName];
  }
  saveState(); markDirty();
}

    function updateTopicName(newName) {
  if (!newName.trim() || newName === state.activeTopic) return;
  const oldName = state.activeTopic;
  const draft = state.data[state.activeSubject][oldName];
  
  state.data[state.activeSubject][newName] = draft;
  delete state.data[state.activeSubject][oldName];
  state.activeTopic = newName;
  
  // We DO NOT change state.activePath. The filename remains the same.
  
  saveState(); markDirty();
}

    function saveDraft() {
      if (!state.activeSubject || !state.activeTopic) return;
      if (!state.data[state.activeSubject]) state.data[state.activeSubject] = {};
      if (!state.data[state.activeSubject][state.activeTopic]) state.data[state.activeSubject][state.activeTopic] = { notes: '', svgs: [] };
      
      state.data[state.activeSubject][state.activeTopic].notes = document.getElementById('note-editor').value;
      
      if (state.activeSvgIndex > -1) {
        const svgs = state.data[state.activeSubject][state.activeTopic].svgs;
        if (svgs[state.activeSvgIndex]) svgs[state.activeSvgIndex].code = document.getElementById('svg-editor').value.trim();
      }
      saveState();
      markDirty(); schedulePreview();
    }

        const res = await fetch('/api/publish-bank', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },

            code: '',

    async function createNewFile() {
      if (!state.github.owner || !state.github.repo || !state.github.token) return toast('Set GitHub settings first', 'error');
      
      let defaultPath = 'new-subject/new-topic.js';
      if (state.activePath) {
          const parts = state.activePath.split('/');
          parts.pop(); 
          defaultPath = parts.join('/') + '/new-topic.js';
      }

      const path = prompt("Enter new file path (must end in .js):\nDo not include 'question-banks/'.", defaultPath);
      if (!path) return;
      
      let cleanPath = path.replace(/^question-banks\//i, '').replace(/^\/+|\/+$/g, '');
      if (!cleanPath.endsWith('.js')) cleanPath += '.js';
      
      toast('Creating file...', 'info');

      try {
        const parts = cleanPath.split('/');
        const filename = parts.pop().replace('.js', '');
        const subjectSlug = parts.length > 0 ? parts[0] : 'general';
        const formatName = (str) => str.charAt(0).toUpperCase() + str.slice(1).replace(/-/g, ' ');
        
        const subj = formatName(subjectSlug);
        const topic = formatName(filename);

        const templateCode = `/* ${subj} — ${topic} notes */\nwindow.CBT_SUBJECT_NOTES = window.CBT_SUBJECT_NOTES || {};\nwindow.CBT_SUBJECT_NOTES['${subj}'] = window.CBT_SUBJECT_NOTES['${subj}'] || {};\nwindow.CBT_SUBJECT_NOTES['${subj}']['${topic}'] = \`## ${topic}\nStart writing your notes here...\n\`;\n\nwindow.CBT_SUBJECT_IMAGES = window.CBT_SUBJECT_IMAGES || {};\nwindow.CBT_SUBJECT_IMAGES['${subj}'] = window.CBT_SUBJECT_IMAGES['${subj}'] || {};\nwindow.CBT_SUBJECT_IMAGES['${subj}']['${topic}'] = [];\n`;

        const res = await fetch('/api/publish-bank', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            filename: `question-banks/${cleanPath}`, 
            code: templateCode, 
            githubToken: state.github.token, 
            repoOwner: state.github.owner, 
            repoName: state.github.repo 
          })
        });
        
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || 'Failed to create file');
        
        toast('File created successfully!', 'success');
        
        await fetchGitHubTree(true);
        loadFileFromPath(cleanPath);
        
      } catch (err) {
        toast(err.message, 'error');
      }
    }

      const sb = document.getElementById('sidebar');

      }

    function renderSVGList() {
      if (!state.activeSubject || !state.activeTopic) return;
      const container = document.getElementById('svg-list-container');
      const draft = state.data[state.activeSubject][state.activeTopic];
      const svgs = (draft && draft.svgs) ? draft.svgs : [];
      
      if (svgs.length === 0) {
        container.innerHTML = '<p class="text-xs text-gray-500 italic py-4 w-full text-center border border-dashed border-[#1e2740] rounded-lg">No SVGs attached. Click "+ New SVG" to add.</p>';
        return;
      }

      container.innerHTML = svgs.map((svg, i) => {
        const isActive = state.activeSvgIndex === i;
        let previewUrl = '';
        
        if (svg.code && svg.code.trim().startsWith('<svg')) {
          const blob = new Blob([svg.code], {type: 'image/svg+xml'});
          previewUrl = URL.createObjectURL(blob);
        } else {
          const subjSlug = state.activePath.split('/')[0] || 'general';
          previewUrl = `https://raw.githubusercontent.com/${state.github.owner}/${state.github.repo}/main/question-banks/${subjSlug}/svg/${svg.filename}`;
        }

        return `<button onclick="selectSVG(${i})" class="svg-item-btn flex-none w-24 h-20 rounded-xl border border-[#1e2740] bg-[#101830] p-2 overflow-hidden flex flex-col items-center justify-center ${isActive ? 'active' : ''}">
          <img src="${previewUrl}" class="w-full h-10 object-contain mb-1" onerror="this.src='data:image/svg+xml;charset=utf-8,%3Csvg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'100\\' height=\\'100\\'%3E%3Crect width=\\'100\\' height=\\'100\\' fill=\\'%231e2740\\'/%3E%3Ctext x=\\'50\\' y=\\'50\\' fill=\\'%238598AC\\' font-size=\\'12\\' text-anchor=\\'middle\\' dy=\\'.3em\\'%3ENo Code%3C/text%3E%3C/svg%3E'">
          <span class="text-[9px] truncate w-full text-center text-gray-400 font-mono">${svg.filename || 'image.svg'}</span>
        </button>`;
      }).join('');
    }

    function createNewSVG() {
      if (!state.activeSubject || !state.activeTopic) return toast('Select a topic first', 'error');
      if (!state.data[state.activeSubject][state.activeTopic]) state.data[state.activeSubject][state.activeTopic] = { notes: '', svgs: [] };
      
      const svgs = state.data[state.activeSubject][state.activeTopic].svgs;
      svgs.push({ filename: `image-${svgs.length + 1}.svg`, code: '' });
      selectSVG(svgs.length - 1);
    }

    function selectSVG(index) {
      state.activeSvgIndex = index;
      const svg = state.data[state.activeSubject][state.activeTopic].svgs[index];
      
      document.getElementById('svg-editor-area').classList.remove('hidden');
      document.getElementById('svg-editor-area').classList.add('flex');
      document.getElementById('svg-editor').value = svg.code || '';
      document.getElementById('svg-filename').value = svg.filename || '';
      renderSVGList();

    function closeSVGEditor() {
      state.activeSvgIndex = -1;
      document.getElementById('svg-editor-area').classList.add('hidden');
      document.getElementById('svg-editor-area').classList.remove('flex');
      renderSVGList();
    }

    function deleteActiveSVG() {
      if (state.activeSvgIndex === -1) return;
      if (!confirm('Delete this SVG?')) return;
      state.data[state.activeSubject][state.activeTopic].svgs.splice(state.activeSvgIndex, 1);
      closeSVGEditor();
      saveState();

    /* ===== VIDEO + SVG EMBEDS (shared by the note builder and the website) =====
       Syntax inside notes:
         @[Title](https://youtu.be/xxxx)        video with caption
         https://www.youtube.com/watch?v=xxxx   bare link on its own line
         @[svg](filename.svg)                   SVG from its saved file
       Chapters: lines directly under a video, e.g.
         @[Fluid statics](https://youtu.be/xxxx)
         0:00 Introduction
         2:15 Bernoulli's equation
         1:05:30 Worked examples
       Playlists: paste a YouTube playlist link; the note builder lists its videos under it:
         @[Fluid Mechanics course](https://www.youtube.com/playlist?list=PLxxxx)
         dQw4w9WgXcQ | Lecture 1: Introduction
         9bZkp7q19f0 | Lecture 2: Pressure
       Students pick any video from the list on the website.
       Supports YouTube, Vimeo, Google Drive (no seeking) and direct .mp4/.webm/.ogg */
    (function () {
      if (window.CBTVideo) return;
      var POS_KEY = 'cbt_video_pos';
      var EXPL = /^[ \t]*@\[([^\]]*)\]\(\s*([^)\s]+)\s*\)[ \t]*$/;
      var BARE = /^[ \t]*(https?:\/\/[^\s<>]+)[ \t]*$/;
      var PLITEM = /^[ \t]*(?:[-*][ \t]+)?([A-Za-z0-9_-]{11})[ \t]*\|[ \t]*(\S.*?)[ \t]*$/;
      var CHAP = /^[ \t]*(?:[-*][ \t]+)?(\d{1,2}(?::\d{2}){1,2})[ \t]*[-\u2013\u2014:.)]*[ \t]+(\S.*?)[ \t]*$/;

      var vEsc = function (s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
      function parseTime(s) { return s.split(':').reduce(function (a, p) { return a * 60 + Number(p); }, 0); }
      function fmt(sec) {
        sec = Math.max(0, Math.floor(sec)); var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
        return (h ? h + ':' + (m < 10 ? '0' : '') + m : m) + ':' + (s < 10 ? '0' : '') + s;
      }

      /* ---- one-time CSS (self-contained, works on dark and light reading themes) ---- */
      if (!document.getElementById('cbt-video-css')) {
        var st = document.createElement('style'); st.id = 'cbt-video-css';
        st.textContent = '.video-chapters{display:flex;flex-direction:column;gap:4px;margin-top:10px}' +
          '.vid-chapter{display:flex;gap:10px;align-items:baseline;text-align:left;padding:7px 10px;border-radius:9px;background:rgba(127,127,127,.12);border:1px solid rgba(127,127,127,.18);font-size:.88em;color:inherit;cursor:pointer;transition:background .15s}' +
          '.vid-chapter:hover:not(:disabled){background:rgba(207,166,70,.2)}.vid-chapter:disabled{opacity:.5;cursor:not-allowed}' +
          '.vid-time{font-variant-numeric:tabular-nums;font-weight:700;color:#c9a23f;min-width:3.4em}' +
          '.vid-playlist{margin-top:12px;border:1px solid rgba(127,127,127,.25);border-radius:12px;overflow:hidden}' +
          '.vid-pl-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;font-size:.8em;font-weight:700;background:rgba(127,127,127,.12)}' +
          '.vid-now{font-weight:600;opacity:.75;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}' +
          '.vid-pl-items{position:relative;max-height:340px;overflow-y:auto}' +
          '.vid-pl-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border:0;border-bottom:1px solid rgba(127,127,127,.15);background:transparent;color:inherit;cursor:pointer;transition:background .15s}' +
          '.vid-pl-item:hover{background:rgba(207,166,70,.12)}.vid-pl-item.active{background:rgba(207,166,70,.2);box-shadow:inset 3px 0 0 #c9a23f}' +
          '.vid-pl-num{width:1.8em;flex:none;text-align:center;font-size:.75em;opacity:.6;font-variant-numeric:tabular-nums}' +
          '.vid-pl-item img{width:96px;height:54px;flex:none;object-fit:cover;border-radius:6px;background:#000}' +
          '.vid-pl-title{font-size:.88em;line-height:1.35;min-width:0}' +
          '.vid-bar{margin-top:8px}.vid-resume{padding:6px 12px;border-radius:9px;font-size:.82em;font-weight:700;background:rgba(207,166,70,.16);border:1px solid rgba(207,166,70,.45);color:#c9a23f;cursor:pointer}';
        (document.head || document.documentElement).appendChild(st);
      }

      /* ---- watch position memory ---- */
      function loadPos() { try { return JSON.parse(localStorage.getItem(POS_KEY) || '{}') || {}; } catch (e) { return {}; } }
      var lastSave = {};
      function savePos(url, sec, dur, lastKey, vid) {
        if (!url || typeof sec !== 'number' || !isFinite(sec)) return;
        var now = Date.now(); if (now - (lastSave[url] || 0) < 3000) return; lastSave[url] = now;
        var p = loadPos();
        if (sec < 5 || (dur && sec > dur - 8)) delete p[url];
        else { p[url] = Math.floor(sec); if (lastKey && vid) p[lastKey] = vid; }
        try { localStorage.setItem(POS_KEY, JSON.stringify(p)); } catch (e) {}
      }
      function post(f, o) { try { f.contentWindow.postMessage(JSON.stringify(o), '*'); } catch (e) {} }

      function plSrc(vid, list, start, auto) {

      /* ---- recognising links ---- */
      function kindOf(url) {
        url = String(url || '').trim();
        var pl = url.match(/[?&]list=([\w-]+)/i);
        if (pl && /(?:youtube\.com|youtu\.be)\//i.test(url)) {
          var sv = url.match(/[?&]v=([\w-]{11})/i) || url.match(/youtu\.be\/([\w-]{11})/i);
          return { t: 'ytpl', list: pl[1], id: sv ? sv[1] : '' };
        }
        var m = url.match(/(?:youtube\.com\/(?:watch\?(?:[^#\s]*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/i);
        if (m) { var t = url.match(/[?&#](?:t|start)=(\d+)/i); return { t: 'yt', id: m[1], start: t ? +t[1] : 0 }; }

      /* ---- video player markup ---- */

        var src = first ? plSrc(first, k.list, 0, false) : 'https://www.youtube-nocookie.com/embed/videoseries?list=' + encodeURIComponent(k.list) + '&rel=0&enablejsapi=1';
        var player = '<div style="position:relative;width:100%;padding-bottom:56.25%;height:0;border-radius:12px;overflow:hidden;background:#000">' +
          '<iframe src="' + vEsc(src) + '" data-vtype="yt" onload="CBT_VID_INIT(this)" title="' + vEsc(title || 'Playlist') + '" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;border:0" ' +
          'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>';
        var pos = loadPos(), last = pos[url + '#last'], lt = last ? pos[url + '#' + last] : 0;

        var firstItem = items.filter(function (i) { return i.id === first; })[0];
        var list = items.length ? '<div class="vid-playlist"><div class="vid-pl-head"><span><i class="fas fa-list-ul"></i> Playlist · ' + items.length + ' videos</span>' +
          '<span class="vid-now">' + (firstItem ? 'Now playing: ' + vEsc(firstItem.title) : '') + '</span></div><div class="vid-pl-items">' +
          items.map(function (it, i) {
            return '<button type="button" class="vid-pl-item' + (it.id === first ? ' active' : '') + '" data-vid="' + it.id + '" onclick="CBT_PLAY(this,\'' + it.id + '\')">' +
              '<span class="vid-pl-num">' + (i + 1) + '</span><img loading="lazy" alt="" src="https://i.ytimg.com/vi/' + it.id + '/mqdefault.jpg"><span class="vid-pl-title">' + vEsc(it.title) + '</span></button>';
          }).join('') + '</div></div>' : '';
        var cap = title ? '<div style="font-size:.85em;opacity:.75;margin-top:6px;text-align:center;font-style:italic">' + vEsc(title) + '</div>' : '';
        return '<div class="video-embed no-mathjax" data-vurl="' + vEsc(url) + '" data-list="' + vEsc(k.list) + '" data-vcur="' + first + '" style="margin:1.2em 0">' + player + resume + list + cap + '</div>';
      }

      function embed(url, title, chapters, compact, items) {

          player = '<div style="position:relative;width:100%;padding-bottom:56.25%;height:0;border-radius:12px;overflow:hidden;background:#000">' +
            '<iframe src="' + vEsc(src) + '" data-vtype="' + k.t + '" onload="CBT_VID_INIT(this)" title="' + vEsc(title || 'Video') + '" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;border:0" ' +

      /* ---- SVG from a saved file ---- */
      function isSvgRef(url, title) { return /\.svg(\?[^\s]*)?$/i.test(url) || String(title || '').toLowerCase() === 'svg'; }

      /* ---- scanning a note ---- */
      function scan(text, compact) {
        var lines = String(text || '').split(/\r?\n/), out = [], store = [], meta = [], i = 0;

    function parseMarkdownWithMath(rawText, compactVideos) {
      if (!rawText) return '';
      if (!window.marked) return rawText;

      const mathBlocks = [];

      text = text.replace(/\\\[([\s\S]*?)\\\]/g, function(match) { mathBlocks.push(match); return `@@MATHBLOCK${mathBlocks.length - 1}@@`; });
      text = text.replace(/\$\$([\s\S]*?)\$\$/g, function(match) { mathBlocks.push(match); return `@@MATHBLOCK${mathBlocks.length - 1}@@`; });
      text = text.replace(/\\\((.*?)\\\)/g, function(match) { mathBlocks.push(match); return `@@MATHBLOCK${mathBlocks.length - 1}@@`; });

      let html = window.marked.parse(text);

      html = html.replace(/@@MATHBLOCK(\d+)@@/g, function(match, index) {
        return mathBlocks[index];
      });

      return CBTVideo.restore(html, videoBlocks);

    function svgSafeName(name) {

    // Lets @[svg](file.svg) in a note resolve to the SVG saved in this topic
    window.CBT_SVG_RESOLVER = function (ref) {
      const draft = state.data[state.activeSubject]?.[state.activeTopic];
      if (!draft || !draft.svgs) return null;
      const want = svgSafeName(ref).toLowerCase();
      const svg = draft.svgs.find(s => svgSafeName(s.filename).toLowerCase() === want);
      if (!svg) return null;
      if (svg.code && svg.code.trim().startsWith('<svg')) return URL.createObjectURL(new Blob([svg.code], { type: 'image/svg+xml' }));
      const folder = (state.activePath || '').split('/').slice(0, -1).join('/') || 'general';

    };

    function insertSvgRef() {

            : `https://raw.githubusercontent.com/${state.github.owner}/${state.github.repo}/main/question-banks/${subjSlug}/svg/${svg.filename}`;
            
          return `<div onclick="viewImageFullscreen('${imgUrl}')" class="bg-[#101830] border border-[#1e2740] rounded-lg p-2 cursor-pointer transition-transform active:scale-95 hover:border-amber-500/50">
            <img src="${imgUrl}" class="w-full h-32 object-contain rounded" onerror="this.src='data:image/svg+xml;charset=utf-8,%3Csvg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'100\\' height=\\'100\\'%3E%3Crect width=\\'100\\' height=\\'100\\' fill=\\'%231e2740\\'/%3E%3Ctext x=\\'50\\' y=\\'50\\' fill=\\'%238598AC\\' font-size=\\'10\\' text-anchor=\\'middle\\' dy=\\'.3em\\'%3ENo Img%3C/text%3E%3C/svg%3E'">
          </div>`;
        }).join('');
      } else {
        gallery.innerHTML = '<p class="text-xs text-gray-500 italic col-span-2">No images attached.</p>';
      }
      
      if (window.MathJax) MathJax.typesetPromise([document.getElementById('pane-preview')]).catch(()=>{});
    }

    function viewImageFullscreen(url) {
      const overlay = document.createElement('div');
      overlay.className = 'fixed inset-0 bg-black/95 z-[9999] flex items-center justify-center p-4 cursor-zoom-out animate-fadeIn';
      overlay.onclick = () => overlay.remove();
      overlay.innerHTML = `<img src="${url}" class="max-w-full max-h-[90vh] object-contain rounded-lg shadow-2xl bg-[#0B1020] border border-[#1e2740]">`;
      document.body.appendChild(overlay);
    }

async function publishToGitHub() {
      if (!state.github.owner || !state.github.repo || !state.github.token) return toast('Set GitHub settings first', 'error');
      if (!state.activePath) return toast('Select a file from the sidebar first.', 'error');
      
      const draft = state.data[state.activeSubject]?.[state.activeTopic];
      if (!draft) return toast('No data to publish.', 'error');

      // Get the path parts, but DON'T change them based on the input names.
      // The file stays exactly where it was loaded from.
      const pathParts = state.activePath.split('/');
      const filename = pathParts.pop(); 
      const topicSlug = pathParts.length > 0 ? pathParts[pathParts.length - 1] : 'general';
      const subjectFolderPath = pathParts.length > 0 ? pathParts.join('/') : 'general';
      
      const subj = document.getElementById('subject-name-input').value;
      const topic = document.getElementById('topic-name-input').value;
      
      const btn = document.getElementById('btn-publish');
      const originalHTML = btn.innerHTML;
      btn.innerHTML = '<span class="spinner"></span> Publishing...';
      btn.disabled = true;
      renderSaveStatus(true);

      try {
        let safeNotes = (draft.notes || '').replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$\{/g, '\\${');
        let notesContent = `/* Auto-generated by Admin Studio */\nwindow.CBT_SUBJECT_NOTES = window.CBT_SUBJECT_NOTES || {};\nwindow.CBT_SUBJECT_NOTES['${subj}'] = window.CBT_SUBJECT_NOTES['${subj}'] || {};\nwindow.CBT_SUBJECT_NOTES['${subj}']['${topic}'] = \`${safeNotes}\`;\n`;
        
        let imagesContent = `window.CBT_SUBJECT_IMAGES = window.CBT_SUBJECT_IMAGES || {};\nwindow.CBT_SUBJECT_IMAGES['${subj}'] = window.CBT_SUBJECT_IMAGES['${subj}'] || {};\nwindow.CBT_SUBJECT_IMAGES['${subj}']['${topic}'] = [\n`;
        
        if (draft.svgs && draft.svgs.length > 0) {
          for (let i = 0; i < draft.svgs.length; i++) {
            const svg = draft.svgs[i];
            let rawName = (svg.filename || '').trim();
            if (!rawName) rawName = `${topicSlug}-image-${i + 1}.svg`;
            if (!rawName.toLowerCase().endsWith('.svg')) rawName += '.svg';
            const safeSvgName = rawName.replace(/[^a-zA-Z0-9.\-_]/g, '-').replace(/-+/g, '-');
            
            imagesContent += `  { data: 'question-banks/${subjectFolderPath}/svg/${safeSvgName}', filename: '${safeSvgName}' },\n`;
            
            if (svg.code && svg.code.trim().length > 0) {
               const svgRes = await fetch('/api/publish-bank', {
                  method: 'POST', headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ filename: `${subjectFolderPath}/svg/${safeSvgName}`, code: svg.code, githubToken: state.github.token, repoOwner: state.github.owner, repoName: state.github.repo })
               });
               if (!svgRes.ok) {
                 const err = await svgRes.json().catch(()=>({}));
                 throw new Error('SVG Error: ' + (err.error || 'Failed to upload ' + safeSvgName));
               }
            }
          }
        }
        imagesContent += `];\n`;
        const finalCode = notesContent + '\n' + imagesContent;

        // 1. Publish the file to the ORIGINAL path
        const res = await fetch('/api/publish-bank', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: state.activePath, code: finalCode, githubToken: state.github.token, repoOwner: state.github.owner, repoName: state.github.repo })
        });
        
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || 'Publish failed');
        toast('Published ' + filename + ' successfully!', 'success');
        markDirty(false);

        // 2. Trigger index.html update
        toast('Updating index.html...', 'info');
        try {
            const indexRes = await fetch('/api/publish-bank', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ 
                filename: 'update-index', 
                githubToken: state.github.token, 
                repoOwner: state.github.owner, 
                repoName: state.github.repo 
              })
            });
            const indexData = await indexRes.json();
            if (!indexRes.ok) throw new Error(indexData.error || 'Failed to update index.html');
            toast('Index updated successfully!', 'success');
        } catch (indexErr) {
            console.warn('Index update failed:', indexErr);
            toast(indexErr.message, 'error');
        }

      } catch (err) {
        toast('Publish failed: ' + err.message, 'error');
      } finally {
        btn.innerHTML = originalHTML;
        btn.disabled = false;
        renderSaveStatus();
      }
    }

    function openModal(id) { 
      if (!state.github) state.github = { owner: '', repo: '', token: '' };
      if (id === 'github-modal') {
        document.getElementById('gh-owner').value = state.github.owner || '';
        document.getElementById('gh-repo').value = state.github.repo || '';
        document.getElementById('gh-token').value = state.github.token || '';
      }
      document.getElementById(id).classList.remove('hidden'); 
    }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    function saveGithubSettings() {
      state.github.owner = document.getElementById('gh-owner').value.trim();
      state.github.repo = document.getElementById('gh-repo').value.trim();
      state.github.token = document.getElementById('gh-token').value.trim();
      saveState(); closeModal('github-modal'); toast('Settings saved', 'success');
      fetchGitHubTree(true); 
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      document.getElementById(`pane-${tab}`).classList.add('active');
      if (tab === 'preview') updatePreview();
    }

    /* ===== Video / playlist insertion ===== */
    async function fetchPlaylist(listId) {
      const res = await fetch('/api/youtube-playlist?list=' + encodeURIComponent(listId));
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.items) throw new Error(data.error || 'Could not read the playlist');
      return data;
    }
    function playlistBlock(title, listId, items) {
      const lines = items.map(i => i.id + ' | ' + String(i.title || 'Video').replace(/[\r\n]+/g, ' ').trim());
      return '@[' + title + '](https://www.youtube.com/playlist?list=' + listId + ')' + (lines.length ? '\n' + lines.join('\n') : '');
    }
    async function insertVideoLink() {
      const url = (prompt('Paste a YouTube video or PLAYLIST link (also Vimeo, Google Drive, .mp4):') || '').trim();
      if (!url) return;
      const kind = CBTVideo.kindOf(url);
      if (!kind) return toast('Not a recognised video link.', 'error');

      if (kind.t === 'ytpl') {
        toast('Reading playlist…', 'info');
        let data = null;
        try { data = await fetchPlaylist(kind.list); }
        catch (e) { toast('Could not list the videos (' + e.message + '). The YouTube playlist player will still be added.', 'error'); }
        const title = (prompt('Caption for this playlist:', (data && data.title) || 'Playlist') || '').trim() || 'Playlist';
        insertText('note-editor', '\n\n' + playlistBlock(title, kind.list, data ? data.items : []) + '\n\n');
        if (data) toast('Playlist added: ' + data.items.length + ' videos' + (data.truncated ? ' (first ' + data.items.length + ' shown)' : '') + '.', 'success');
        return;
      }

      const title = (prompt('Optional caption (leave blank for none):') || '').trim();
      insertText('note-editor', '\n\n@[' + (title || 'video') + '](' + url + ')\n0:00 Introduction\n2:00 Next topic\n\n');
      toast('Video added. Edit the chapter times under it (or delete those lines).', 'success');
    }

    /* Re-reads every playlist in the note so new/removed/renamed videos are picked up */
    async function syncPlaylists() {
      const ta = document.getElementById('note-editor'); if (!ta) return;
      const lines = ta.value.split('\n'), out = [];
      let done = 0, failed = 0;
      for (let i = 0; i < lines.length;) {
        const line = lines[i];
        const m = line.match(/^[ \t]*@\[([^\]]*)\]\(\s*([^)\s]+)\s*\)[ \t]*$/);
        const bare = !m && line.match(/^[ \t]*(https?:\/\/[^\s<>]+)[ \t]*$/);
        const url = m ? m[2] : (bare ? bare[1] : '');
        const kind = url ? CBTVideo.kindOf(url) : null;
        if (!kind || kind.t !== 'ytpl') { out.push(line); i++; continue; }
        let j = i + 1;
        while (j < lines.length && CBTVideo.PLITEM.test(lines[j])) j++;
        try {
          const data = await fetchPlaylist(kind.list);
          out.push(playlistBlock(m ? m[1] : (data.title || 'Playlist'), kind.list, data.items));
          done++;
        } catch (e) { out.push(...lines.slice(i, j)); failed++; }
        i = j;
      }
      if (!done && !failed) return toast('No playlists found in this note.', 'info');
      ta.value = out.join('\n'); saveDraft();
      toast(done + ' playlist(s) refreshed' + (failed ? ', ' + failed + ' failed' : ''), failed ? 'error' : 'success');
    }

    function insertText(id, text) {
      const el = document.getElementById(id), start = el.selectionStart, end = el.selectionEnd;
      el.value = el.value.substring(0, start) + text + el.value.substring(end);
      el.focus(); el.selectionStart = el.selectionEnd = start + text.length; saveDraft();
    }

    function toast(msg, type) {
      const el = document.createElement('div');
      el.className = `text-white text-xs font-bold px-4 py-3 rounded-xl shadow-2xl mb-2 animate-[fadeIn_0.2s_ease] ${type==='error'?'bg-rose-600':(type==='success'?'bg-emerald-600':'bg-indigo-600')}`;
      el.textContent = msg;
      document.getElementById('toast-layer').appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3000);
    }

    window.onload = () => {
      document.getElementById('gh-owner').value = state.github.owner || '';
      document.getElementById('gh-repo').value = state.github.repo || '';
      document.getElementById('gh-token').value = state.github.token || '';
      
      if (state.github.owner && state.github.repo && state.github.token) {
        fetchGitHubTree();
      }
    };
  </script>
